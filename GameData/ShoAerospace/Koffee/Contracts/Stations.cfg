// Optional pack. KoffeeContracts supplies read-only checks for live Koffee capabilities and assignments.
CONTRACT_GROUP:NEEDS[ContractConfigurator,KoffeeContracts]
{
    name = KoffeeStations
    displayName = Format("#Koffee_Contract_Group", [])
    minVersion = 2.13.4
    maxSimultaneous = 3
    // Stock station funds use destination weighting; reputation and science do not.
    useTargetBodyForReward = false
}

CONTRACT_TYPE:NEEDS[ContractConfigurator,KoffeeContracts]
{
    name = KoffeeStationTutorial
    group = KoffeeStations
    title = Format("#Koffee_Contract_Tutorial_Title", [@/targetBody])
    genericTitle = Format("#Koffee_Contract_Tutorial_Generic", [])
    description = Format("#Koffee_Contract_Tutorial_Description", [@/targetBody])
    synopsis = Format("#Koffee_Contract_Tutorial_Synopsis", [])
    completedMessage = Format("#Koffee_Contract_Tutorial_Complete", [])
    prestige = Trivial
    maxSimultaneous = 2
    targetBody = @destination

    DATA
    {
        type = CelestialBody
        uniquenessCheck = CONTRACT_ALL
        destination = AllBodies().Where(b => !b.IsHomeWorld() && b != Sun() && b.HaveReached()).Random()
    }

    // Squad/Contracts/Contracts.cfg: Station base rewards, before stock prestige/difficulty factors.
    advanceFunds = 32000 * @targetBody.Multiplier()
    rewardFunds = 83000 * @targetBody.Multiplier()
    failureFunds = 0
    rewardScience = 0
    rewardReputation = 18
    failureReputation = 9
    minExpiry = 1
    maxExpiry = 7
    deadline = 2982 * @targetBody.Multiplier()

    REQUIREMENT
    {
        name = FirstFlyby
        type = FlyBy
    }
    REQUIREMENT
    {
        name = AvailableHardware
        type = KoffeeHardware
        capability = Any
        checkOnActiveContract = false
    }

    PARAMETER
    {
        name = Station
        type = VesselParameterGroup
        title = Format("#Koffee_Contract_SameStation", [])
        PARAMETER
        {
            name = Orbit
            type = ReachState
            situation = ORBITING
            disableOnStateChange = false
        }
        PARAMETER
        {
            name = Laboratory
            type = KoffeeLaboratory
            capability = Any
            title = Format("#Koffee_Contract_AnyLab", [])
            disableOnStateChange = false
        }
        PARAMETER
        {
            name = Manager
            type = PartValidation
            partModule = ModuleKoffeeExperimentManager
            title = Format("#Koffee_Contract_Manager", [])
            disableOnStateChange = false
        }
        PARAMETER
        {
            name = Engineer
            type = KoffeeAssignedEngineer
            title = Format("#Koffee_Contract_Engineer", [])
            disableOnStateChange = false
        }
    }
}

CONTRACT_TYPE:NEEDS[ContractConfigurator,KoffeeContracts]
{
    name = KoffeeStationBiGEn
    group = KoffeeStations
    title = Format("#Koffee_Contract_BiGEn_Title", [@/targetBody])
    genericTitle = Format("#Koffee_Contract_BiGEn_Generic", [])
    description = Format("#Koffee_Contract_Expansion_Description", [@/targetStation, @/capability])
    synopsis = Format("#Koffee_Contract_Expansion_Synopsis", [])
    completedMessage = Format("#Koffee_Contract_Expansion_Complete", [])
    prestige = Significant
    maxSimultaneous = 1
    targetBody = @destination

    DATA
    {
        type = string
        capability = BiGEn
    }
    DATA
    {
        type = Vessel
        targetStation = AllVessels().Where(v => v.KoffeeCanExpand(@capability)).Random()
    }
    DATA
    {
        type = CelestialBody
        uniquenessCheck = CONTRACT_ALL
        destination = @targetStation.CelestialBody()
    }

    advanceFunds = 32000 * @targetBody.Multiplier()
    rewardFunds = 83000 * @targetBody.Multiplier()
    failureFunds = 0
    rewardScience = 0
    rewardReputation = 18
    failureReputation = 9
    minExpiry = 1
    maxExpiry = 7
    deadline = 2982 * @targetBody.Multiplier()

    REQUIREMENT
    {
        name = FirstFlyby
        type = FlyBy
    }
    REQUIREMENT
    {
        name = AvailableHardware
        type = KoffeeHardware
        capability = @/capability
        checkOnActiveContract = false
    }

    PARAMETER
    {
        name = Station
        type = VesselParameterGroup
        title = Format("#Koffee_Contract_ExistingStation", [@/targetBody])
        PARAMETER
        {
            name = OriginalStation
            type = KoffeeStationAnchor
            targetStation = @/targetStation
            title = Format("#Koffee_Contract_OriginalStation", [])
            disableOnStateChange = false
        }
        PARAMETER
        {
            name = Orbit
            type = ReachState
            situation = ORBITING
            disableOnStateChange = false
        }
        PARAMETER
        {
            name = Laboratory
            type = KoffeeLaboratory
            capability = @/capability
            title = Format("#Koffee_Contract_AdvancedLab", [@/capability])
            disableOnStateChange = false
        }
        PARAMETER
        {
            name = Engineer
            type = KoffeeAssignedEngineer
            title = Format("#Koffee_Contract_Engineer", [])
            disableOnStateChange = false
        }
    }
}

+CONTRACT_TYPE[KoffeeStationBiGEn]:NEEDS[ContractConfigurator,KoffeeContracts]
{
    @name = KoffeeStationMaPhyTec
    @title = Format("#Koffee_Contract_MaPhyTec_Title", [@/targetBody])
    @genericTitle = Format("#Koffee_Contract_MaPhyTec_Generic", [])
    @DATA:HAS[#capability[BiGEn]]
    {
        @capability = MaPhyTec
    }
}
