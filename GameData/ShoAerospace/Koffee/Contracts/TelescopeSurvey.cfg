CONTRACT_TYPE:NEEDS[ContractConfigurator,Koffee]
{
    name = KoffeeTelescopeSurvey
    group = KoffeeOrbitalResearch
    title = Format("#Koffee_TelescopeSurvey_Title", [@/targetBody])
    genericTitle = Format("#Koffee_TelescopeSurvey_GenericTitle", [])
    description = Format("#Koffee_TelescopeSurvey_Description", [@/targetBody])
    genericDescription = Format("#Koffee_TelescopeSurvey_GenericDescription", [])
    synopsis = Format("#Koffee_TelescopeSurvey_Synopsis", [@/targetBody])
    completedMessage = Format("#Koffee_TelescopeSurvey_Complete", [])
    targetBody = @destination
    prestige = Significant
    maxSimultaneous = 1

    DATA
    {
        type = List<string>
        hidden = true
        introductoryTargets = ["Mun", "Minmus", "Duna", "Ike", "Eve", "Gilly"]
    }
    DATA
    {
        type = bool
        hidden = true
        escapedHome = HomeWorld().HaveEscaped()
    }
    DATA
    {
        type = CelestialBody
        hidden = true
        uniquenessCheck = CONTRACT_ACTIVE
        destination = AllBodies().Where(b => !b.IsSun() && (@escapedHome || @introductoryTargets.Contains(b.Name()))).Random()
    }

    advanceFunds = 12000 * @targetBody.Multiplier()
    rewardFunds = 30000 * @targetBody.Multiplier()
    failureFunds = 0
    rewardScience = 3
    rewardReputation = 8
    failureReputation = 3
    minExpiry = 1
    maxExpiry = 7

    REQUIREMENT
    {
        name = TelescopeAvailable
        type = PartUnlocked
        part = SHOSpaceTelescopeSTS25
    }
    PARAMETER
    {
        name = DeliverTelescopeImage
        type = CollectScience
        title = Format("#Koffee_TelescopeSurvey_Deliver", [@/targetBody])
        targetBody = @/targetBody
        experiment = telescopeObservation
        // The STS-25 science subject uses this situation for the photographed body.
        situation = InSpaceHigh
        recoveryMethod = RecoverOrTransmit
    }
}
