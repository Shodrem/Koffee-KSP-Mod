// One reusable contract type; no new assembly or completion hook.
CONTRACT_GROUP:NEEDS[ContractConfigurator,Koffee]
{
    name = KoffeeOrbitalResearch
    displayName = Format("#Koffee_Orbital_Group", [])
    minVersion = 2.13.4
    maxSimultaneous = 2
    useTargetBodyForReward = false
}

CONTRACT_TYPE:NEEDS[ContractConfigurator,Koffee]
{
    name = KoffeeOrbitalScience
    group = KoffeeOrbitalResearch
    title = Format("#Koffee_Orbital_Title", [@/experiment, @/targetBody])
    genericTitle = Format("#Koffee_Orbital_Generic", [])
    description = Format("#Koffee_Orbital_Description", [@/experiment, @/targetBody])
    genericDescription = Format("#Koffee_Orbital_GenericDescription", [])
    synopsis = Format("#Koffee_Orbital_Synopsis", [@/experiment, @/targetBody])
    completedMessage = Format("#Koffee_Orbital_Complete", [])
    prestige = Trivial
    maxSimultaneous = 2
    targetBody = @destination

    // Known laboratory roles, kept in CFG to avoid changing either DLL.
    DATA
    {
        type = List<AvailablePart>
        hidden = true
        basicLabs = [Large_Crewed_Lab]
        bioLabs = [SHOSpaceLabKF01]
        materialLabs = [SHOAdvancedLab25Test]
    }
    DATA
    {
        type = string
        hidden = true
        sspxDelphi = None
        sspxFate = None
        sspxNature = None
        capability = @basicExperiments.Contains(@experiment) ? "StationBasic" : (@bioExperiments.Contains(@experiment) ? "BiGEn" : "MaPhyTec")
    }
    DATA
    {
        type = List<AvailablePart>
        hidden = true
        requiredValue = false
        optionalLabs = []
    }
    DATA
    {
        type = ScienceExperiment
        hidden = true
        experiment = [algaeCultivation, alloySolidification, batteryConservation, capillaryTransport, containerIntegrityTest, extendedCrewStudy, mineralCrystalGrowth, mysteryGooStudy, opticalSystemStability, polymerAging, radiationDosimetry, solarRadiationPressure, seedGermination, smallMechanismReliability, solarRadiometry, solutionChemistry, surfaceAltimetry, surfaceObservation, thermalEnvironmentStudy].Where(e => (e.ID() == "algaeCultivation" && Tech(koffeeBioGeoEnvironment2).IsUnlocked()) || (e.ID() == "alloySolidification" && Tech(koffeeTechnologyMaterials2).IsUnlocked()) || (e.ID() == "batteryConservation" && Tech(koffeeTechnologyMaterials1).IsUnlocked()) || (e.ID() == "capillaryTransport" && Tech(koffeeTechnologyMaterials2).IsUnlocked()) || (e.ID() == "containerIntegrityTest" && Tech(koffeeExperimental).IsUnlocked()) || (e.ID() == "extendedCrewStudy" && Tech(koffeeExperimental).IsUnlocked()) || (e.ID() == "mineralCrystalGrowth" && Tech(koffeeBioGeoEnvironment2).IsUnlocked()) || (e.ID() == "mysteryGooStudy" && Tech(koffeeTechnologyMaterials1).IsUnlocked()) || (e.ID() == "opticalSystemStability" && Tech(koffeeTechnologyMaterials2).IsUnlocked()) || (e.ID() == "polymerAging" && Tech(koffeeTechnologyMaterials2).IsUnlocked()) || (e.ID() == "radiationDosimetry" && Tech(koffeeBioGeoEnvironment3).IsUnlocked()) || (e.ID() == "solarRadiationPressure" && Tech(koffeeTechnologyMaterials3).IsUnlocked()) || (e.ID() == "seedGermination" && Tech(koffeeBioGeoEnvironment2).IsUnlocked()) || (e.ID() == "smallMechanismReliability" && Tech(koffeeTechnologyMaterials2).IsUnlocked()) || (e.ID() == "solarRadiometry" && Tech(koffeeTechnologyMaterials3).IsUnlocked()) || (e.ID() == "solutionChemistry" && Tech(koffeeTechnologyMaterials2).IsUnlocked()) || (e.ID() == "surfaceAltimetry" && Tech(koffeeBioGeoEnvironment3).IsUnlocked()) || (e.ID() == "surfaceObservation" && Tech(koffeeBioGeoEnvironment3).IsUnlocked()) || (e.ID() == "thermalEnvironmentStudy" && Tech(koffeeBioGeoEnvironment1).IsUnlocked())).Random()
    }
    DATA
    {
        type = List<ScienceExperiment>
        hidden = true
        basicExperiments = [batteryConservation, containerIntegrityTest, extendedCrewStudy, mysteryGooStudy, thermalEnvironmentStudy]
        bioExperiments = [algaeCultivation, mineralCrystalGrowth, radiationDosimetry, seedGermination, surfaceAltimetry, surfaceObservation]
    }
    DATA
    {
        type = List<AvailablePart>
        hidden = true
        laboratories = (@basicExperiments.Contains(@experiment) ? @basicLabs.Where(p => p != Large_Crewed_Lab || Tech(koffeeExperimental).IsUnlocked()) : (@bioExperiments.Contains(@experiment) ? @bioLabs : @materialLabs)).Concat(@optionalLabs)
    }
    DATA
    {
        type = Vessel
        hidden = true
        targetStation = AllVessels().Where(v => v.IsOrbiting() && v.CelestialBody() != Sun() && v.Orbit().Eccentricity() < 1 && v.Orbit().Periapsis() > v.CelestialBody().AtmosphereAltitude() && v.Parts().Where(p => @laboratories.Contains(p)).Count() > 0 && (@experiment.ID() != "containerIntegrityTest" || v.CelestialBody() == HomeWorld()) && (@experiment.ID() != "opticalSystemStability" || v.CelestialBody() == Kerbin || v.CelestialBody() == Mun || v.CelestialBody() == Minmus) && ((@experiment.ID() != "surfaceObservation" && @experiment.ID() != "surfaceAltimetry") || v.CelestialBody().HasSurface())).Random()
    }
    DATA
    {
        type = CelestialBody
        hidden = true
        uniquenessCheck = CONTRACT_ACTIVE
        destination = @targetStation.CelestialBody()
    }

    // Squad/Contracts/Contracts.cfg, Science: base rewards before difficulty.
    // Funds use the destination multiplier; science/reputation do not.
    advanceFunds = 9000 * @targetBody.Multiplier()
    rewardFunds = 22000 * @targetBody.Multiplier()
    failureFunds = 0
    rewardScience = 3
    rewardReputation = 6
    failureReputation = 3
    minExpiry = 1
    maxExpiry = 7
    deadline = 2130 * @targetBody.Multiplier()

    PARAMETER
    {
        name = DeliverOrbitalResult
        type = CollectScience
        targetBody = @/targetBody
        experiment = @/experiment
        location = Space
        recoveryMethod = RecoverOrTransmit
    }
}

// Append optional laboratories only when their parts exist.
@CONTRACT_TYPE[KoffeeOrbitalScience]:NEEDS[ContractConfigurator,Koffee,Benjee10_MMSEV]
{
    @DATA,0
    {
        @basicLabs ^= :\]$:, Benjee10_MMSEV_baseLab]:
    }
}
@CONTRACT_TYPE[KoffeeOrbitalScience]:NEEDS[ContractConfigurator,Koffee,StationPartsExpansionRedux]:FINAL
{
    // Read the installed compatibility roles rather than assuming a version.
    @DATA,1
    {
        @sspxDelphi = #$@PART[sspx-lab-5-1]/MODULE[ModuleKoffeeLab]/stationCapabilities$
        @sspxFate = #$@PART[sspx-lab-375-1]/MODULE[ModuleKoffeeLab]/stationCapabilities$
        @sspxNature = #$@PART[sspx-science-1875-1]/MODULE[ModuleKoffeeLab]/stationCapabilities$
    }
    @DATA,2
    {
        @optionalLabs = [sspx-lab-5-1, sspx-lab-375-1, sspx-science-1875-1].Where(p => (p == sspx-lab-5-1 && @sspxDelphi.Contains(@capability)) || (p == sspx-lab-375-1 && @sspxFate.Contains(@capability)) || (p == sspx-science-1875-1 && @sspxNature.Contains(@capability)))
    }
}
