PART
{
    name = SHOSolarRadiometerRSA
    module = Part
    author = SHO Aerospace
    MODEL
    {
        model = ShoAerospace/Koffee/Parts/SolarRadiometer_RSA/SHO_SolarRadiometer_RSA
    }
    scale = 1
    rescaleFactor = 1
    // Centre of the underside of the mounting plate; outward direction is -Y.
    NODE
    {
        name = attach_South
        transform = attach_South
        size = 0
        method = FIXED_JOINT
    }
    node_attach = 0, 0, 0.015, 0, -1, 0, 0
    attachRules = 1,1,0,0,0
    TechRequired = koffeeTechnologyMaterials3
    entryCost = 6500
    cost = 3200
    category = Science
    subcategory = 0
    title = #LOC_Koffee_RSA_Title
    manufacturer = #LOC_Koffee_Manufacturer
    description = #LOC_Koffee_RSA_Description
    tags = #LOC_Koffee_RSA_Tags
    bulkheadProfiles = srf
    mass = 0.040
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 1
    crashTolerance = 8
    maxTemp = 1200
    MODULE
    {
        name = ModuleAnimateGeneric
        // This clip ends OPEN. KSP reverses it for closing.
        animationName = RSA_Lid_Open
        actionGUIName = #LOC_Koffee_RSA_Lid_Toggle
        startEventGUIName = #LOC_Koffee_RSA_Lid_Open
        endEventGUIName = #LOC_Koffee_RSA_Lid_Close
        allowAnimationWhileShielded = False
        isOneShot = False
        disableAfterPlaying = False
    }
    MODULE
    {
        name = ModuleKoffeeExperimentAnimation
        animationName = RSA_Lid_Open
    }
    MODULE
    {
        name = ModuleCargoPart
        packedVolume = 40
    }
}
