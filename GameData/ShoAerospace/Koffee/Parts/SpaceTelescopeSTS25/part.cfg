// First STS-25 model integration. Cost/mass/technology follow AL-25 provisionally.
PART
{
    name = SHOSpaceTelescopeSTS25
    module = Part
    author = SHO Aerospace
    MODEL
    {
        model = ShoAerospace/Koffee/Parts/SpaceTelescopeSTS25/model
    }
    rescaleFactor = 1
    NODE
    {
        name = bottom
        transform = attach_South
        size = 2
        method = FIXED_JOINT
    }
    // Coaxial 0.625 m core. Offset from the plate compensates the ReStock
    // OKTO hardware extending below its stock bottom node (1.3 mm clearance).
    node_stack_autopilot = 0, 0.2665, 0, 0, 1, 0, 0
    // ED-01 at 75%, using its rear stack node, beside the small probe core.
    node_stack_experiment = 0.8000, 0.2225, 0, 0, 1, 0, 0
    attachRules = 1,0,1,1,0
    bulkheadProfiles = size2
    TechRequired = koffeePhysicsAstronomy1
    entryCost = 16000
    cost = 6500
    category = Science
    subcategory = 0
    title = #LOC_Koffee_STS25_Title
    manufacturer = #LOC_Koffee_Manufacturer
    description = #LOC_Koffee_STS25_Description
    tags = #LOC_Koffee_STS25_Tags
    mass = 3
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.15
    angularDrag = 2
    crashTolerance = 20
    maxTemp = 1200
    skinMaxTemp = 2000
    breakingForce = 200
    breakingTorque = 200
    vesselType = Ship
    CrewCapacity = 1
    crewTransferAvailable = true
    INTERNAL
    {
        name = SHOSpaceTelescopeSTS25_Internal
    }
    MODULE
    {
        name = ModuleAnimateGeneric
        animationName = STS25_Maintenance_Open
        actionGUIName = #LOC_Koffee_STS25_Maintenance_Toggle
        startEventGUIName = #LOC_Koffee_STS25_Maintenance_Open
        endEventGUIName = #LOC_Koffee_STS25_Maintenance_Close
        allowAnimationWhileShielded = False
        isOneShot = False
        disableAfterPlaying = False
    }
    MODULE
    {
        name = ModuleKoffeeLab
        stationCapabilities = Astronomy
    }
    MODULE
    {
        name = ModuleKoffeeTelescope
        cameraTransformName = TelescopeCameraTransform
        // Optional integration; uses stock rendering when Parallax is absent.
        parallaxResourceExperiment = True
        // Acquisition limits; optical validity is independent of science remainder.
        captureMaximumErrorDegrees = 0.5
        captureFieldFraction = 0.2
        captureMinimumDiameterPixels = 8
        // Astronomy II: centre separation in planetary angular radii; useful apparent diameters.
        pairMaximumSeparationRadii = 32
        pairMinimumPlanetDiameterPixels = 24
        pairMinimumMoonDiameterPixels = 4
    }
    MODULE
    {
        name = ModuleScienceContainer
        reviewActionName = #autoLOC_502204
        storeActionName = #autoLOC_502202
        collectActionName = #autoLOC_238018
        evaOnlyStorage = True
        storageRange = 2
        allowRepeatedSubjects = True
    }
    MODULE
    {
        name = ModulePartVariants
        baseVariant = Insulated
        useMultipleDragCubes = false
