PART
{
    name = SHOExperimentDeviceED01
    module = Part
    author = SHO Aerospace

    MODEL
    {
        model = ShoAerospace/Koffee/Parts/Experiments_Device_ED-01/Experiment_Device_ED01
        // Keep exported textures: stock ReplaceTextures cannot handle null maps in this model.
        scale = 1, 1, 1
    }
    scale = 1
    rescaleFactor = 0.75

    // Unscaled attach_Back position; stock rescaleFactor also scales this node.
    // Preserve the authored surface direction after the 180-degree model yaw.
    node_attach = 0, 0, 0.173999995, 0, 0, -1, 0
    // Rear stack node faces outward (+Z); front now faces -Z.
    node_stack_back = 0, 0, 0.173999995, 0, 0, 1, 0
    // Lower node uses unscaled MU coordinates; rescaleFactor applies once.
    node_stack_bottom = 0, -0.396150000, 0, 0, -1, 0, 0
    attachRules = 1,1,1,1,0

    TechRequired = koffeeExperimental
    entryCost = 4000
    cost = 800
    category = Science
    subcategory = 0
    title = #LOC_Koffee_ExperimentDeviceED01_Title
    manufacturer = #LOC_Koffee_Manufacturer
    description = #LOC_Koffee_ExperimentDeviceED01_Description
    tags = #LOC_Koffee_ExperimentDeviceED01_Tags
    bulkheadProfiles = srf

    mass = 0.15
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 1
    crashTolerance = 12
    maxTemp = 1200

    MODULE
    {
        name = ModuleCargoPart
        // 75% renderer envelope: 90.088 L, rounded up.
        packedVolume = 91
        stackableQuantity = 1
    }
}
