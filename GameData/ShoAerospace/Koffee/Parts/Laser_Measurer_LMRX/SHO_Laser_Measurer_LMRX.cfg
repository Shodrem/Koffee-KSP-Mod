PART
{
    name = SHOLaserMeasurerLMRX
    module = Part
    author = SHO Aerospace

    MODEL
    {
        model = ShoAerospace/Koffee/Parts/Laser_Measurer_LMRX/SHO_Laser_Measurer_LMRX
    }
    scale = 1
    rescaleFactor = 1
    // Rear cover and compact pads meet at X=0.010; optics point +X.
    node_attach = 0.010, 0, 0, -1, 0, 0, 0
    // Rear stack attachment is always available.
    node_stack_back = 0.010, 0, 0, -1, 0, 0, 0
    // Lower stack attachment is always available.
    node_stack_bottom = 0.070, -0.153, 0, 0, -1, 0, 0
    attachRules = 1,1,0,0,1

    TechRequired = koffeeBioGeoEnvironment3
    entryCost = 5000
    cost = 2500
    category = Science
    subcategory = 0
    title = #LOC_Koffee_LaserMeasurerLMRX_Title
    manufacturer = #LOC_Koffee_Manufacturer
    description = #LOC_Koffee_LaserMeasurerLMRX_Description
    tags = #LOC_Koffee_LaserMeasurerLMRX_Tags
    bulkheadProfiles = srf
    mass = 0.025
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 1
    crashTolerance = 8
    maxTemp = 1200

    MODULE
    {
        name = ModuleCargoPart
        packedVolume = 20
    }
    // Fixed appearance only; rear/lower/surface attachment is always available.
    MODULE
    {
        name = ModulePartVariants
        // Fixed visual setup only; hide its fields from the PAW.
        isEnabled = false
        baseVariant = Radial
        useMultipleDragCubes = false
        VARIANT
        {
            name = Radial
            displayName = #LOC_Koffee_LaserMeasurerLMRX_Variant_Radial
            GAMEOBJECTS
            {
                LMRX_Feet = false
            }
        }
    }
}
