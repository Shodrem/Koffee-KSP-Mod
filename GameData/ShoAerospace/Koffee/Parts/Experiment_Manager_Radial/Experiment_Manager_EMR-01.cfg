// Experiment Manager: explicit Engineer assignment, no ElectricCharge requirement.
PART
{
    name = SHOExperimentManagerEMR01
    module = Part
    author = SHO Aerospace

    MODEL
    {
        model = ShoAerospace/Koffee/Parts/Experiment_Manager_Radial/Experiment_Manager_EMR-01
    }
    scale = 1
    rescaleFactor = 1

    // Front faces -Z; rear support plane z=0 and surfaceAttach points toward +Z.
    node_attach = 0, 0, 0, 0, 0, 1, 0
    node_stack_back = 0, 0, 0, 0, 0, 1, 0
    node_stack_bottom = 0, -0.240, -0.080, 0, -1, 0, 0
    attachRules = 1,1,0,0,0

    // Space Exploration is a technology node; Science is the stock editor category.
    TechRequired = koffeeExperimental
    entryCost = 2800
    cost = 450
    category = Science
    subcategory = 0
    title = #LOC_Koffee_ExperimentManagerEMR01_Title
    manufacturer = #LOC_Koffee_ExperimentManagerEMR01_Manufacturer
    description = #LOC_Koffee_ExperimentManagerEMR01_Description
    tags = #LOC_Koffee_ExperimentManagerEMR01_Tags

    // Balance from Squad/Parts/Command/probeCoreOcto_v2/probeCoreOcto_v2.cfg.
    mass = 0.1
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.15
    angularDrag = 1.5
    crashTolerance = 12
    maxTemp = 1200
    explosionPotential = 0
    bulkheadProfiles = srf

    MODULE
    {
        name = ModuleKoffeeExperimentManager
        ledTransform = LED_CPU
    }
}
