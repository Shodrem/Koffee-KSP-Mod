// Energy Support: existing internal part ID retained. Physical balance remains provisional.
PART
{
    name = SHOKomfortEmergencySupportTest
    module = Part
    author = SHO Aerospace
    MODEL
    {
        model = ShoAerospace/Koffee/Parts/Komfort_Emergency_Support/Komfort_Emergency_Support_ES375
        scale = 1, 1, 1
    }
    scale = 1
    rescaleFactor = 1
    // Stock NODE transforms use forward (+Z); these authored markers use up.
    // Retain their measured positions and give the stack normals explicitly.
    node_stack_top = 0, 0.60710448, 0, 0, 1, 0, 3
    node_stack_bottom = 0, -0.60710400, 0, 0, -1, 0, 3
    attachRules = 1,0,1,1,0
    bulkheadProfiles = size3
    TechRequired = spaceExploration
    entryCost = 2800
    cost = 450
    category = Utility
    subcategory = 0
    title = #LOC_Koffee_EnergySupport_Title
    manufacturer = #LOC_Koffee_Manufacturer
    description = #LOC_Koffee_EnergySupport_Description
    tags = #LOC_Koffee_EmergencySupport_Tags
    mass = 0.1
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.15
    angularDrag = 1.5
    crashTolerance = 12
    maxTemp = 1200
    explosionPotential = 0
    MODULE
    {
        name = ModuleKomfortService
        service = Emergency
        indicatorTransforms = Green_light
        inactiveIndicatorTransforms = Red_light
        capacity = 2
        serviceEnabled = false
        electricChargePerSecond = 4.5
        heatKilowattsPerKerbal = 50
    }
    MODULE
    {
        name = ModuleKoffeePowerConsumer
        electricChargePerSecond = 0
    }
    // Vessel-wide filtration; generation, consumption and heat share one service tariff.
    MODULE
    {
        name = ModuleEmergencySupport
        electricChargePerSecond = 5
        heatKilowatts = 50
    }
    MODULE
    {
        name = ModuleGenerator
        isAlwaysActive = false
        generatorIsActive = false
        OUTPUT_RESOURCE
        {
            name = ElectricCharge
            rate = 5
        }
    }
}
