// Requires RealChute and ModuleManager. Dimensions measured from SmallCrewChute.mu.
PART:NEEDS[RealChute]
{
    name = SHOSmallCrewChute0625
    module = Part
    author = ShoAerospace

    MODEL
    {
        model = ShoAerospace/Koffee/Parts/SmallCrewChute/SmallCrewChute
        // Preserve the exported dimensions: 0.625 m diameter, 0.400 m height.
        scale = 1, 1, 1
    }
    MODEL
    {
        model = RealChute/Parts/model_RC_canopy
        // 30 m canopy; uniform scale preserves shape as RealChute rotates it.
        scale = 3.032586, 3.032586, 3.032586
        // Main_Exit in the original part coordinates.
        position = -0.003866568, -0.050135694, -0.206097111
        rotation = -90, 0, 0
        texture = RC_canopy_main, RealChute/Parts/RC_canopy_main
    }
    MODEL
    {
        model = RealChute/Parts/model_RC_canopy2
        // 6 m canopy at Drogue_Exit; initially points out of the rear bay.
        scale = 0.6065172, 0.6065172, 0.6065172
        position = -0.003866568, -0.050135676, 0.206493258
        rotation = 90, 0, 0
        texture = RC_canopy_main, RealChute/Parts/RC_canopy_drogue
    }

    scale = 1
    rescaleFactor = 1
    // Nodes at measured Y limits; do not inherit the larger part mounting inset.
    // Size 0 identifies the nominal 0.625 m family.
    node_stack_top = 0, 0.200000056, 0, 0, 1, 0, 0
    node_stack_bottom = 0, -0.200000056, 0, 0, -1, 0, 0
    attachRules = 1,0,1,1,0
    bulkheadProfiles = size0

    TechRequired = start
    entryCost = 0
    cost = 600
    category = Utility
    subcategory = 0
    title = #LOC_Koffee_SmallCrewChute_Title
    manufacturer = #LOC_Koffee_CrewChute_Manufacturer
    description = #LOC_Koffee_SmallCrewChute_Description
    tags = koffee sho parachute chute main drogue recovery landing stack RealChute

    mass = 0.11
    dragModelType = default
    maximum_drag = 0.32
    minimum_drag = 0.2
    angularDrag = 3
    crashTolerance = 12
    maxTemp = 2000
    breakingForce = 100
    breakingTorque = 100
    preferredStage = PARACHUTESTAGE
    stageOffset = -1

    MODULE
    {
        name = RealChuteModule
        caseMass = 0.11
        timer = 0
        mustGoDown = true
        cutSpeed = 0.5
        spareChutes = 5

        // Main first: RealChute derives the secondary chute from the node count.
        // Each cap is hidden/restored by RealChute; no ModuleJettison is needed.
        PARACHUTE
        {
            material = Nylon
            capName = SmallCrewChute_CapMain
            parachuteName = RC_canopy
            preDeploymentAnimation = RC_chute_semi_deploy
            deploymentAnimation = RC_chute_full_deploy
            preDeployedDiameter = 1.5
            deployedDiameter = 30
            minIsPressure = false
            minDeployment = 1200
            deploymentAlt = 700
            cutAlt = -1
            preDeploymentSpeed = 2
            deploymentSpeed = 6
        }
        PARACHUTE
        {
            material = Kevlar
            capName = SmallCrewChute_CapDroge
            parachuteName = RC_canopy2
            preDeploymentAnimation = RC_chute2_semi_deploy
            deploymentAnimation = RC_chute2_full_deploy
            preDeployedDiameter = 3
            deployedDiameter = 6
            minIsPressure = false
            minDeployment = 6000
            deploymentAlt = 2500
            // Main starts reefed at 1200 m before the drogue cuts at 1000 m.
            cutAlt = 1000
            preDeploymentSpeed = 1
            deploymentSpeed = 3
        }
    }

    MODULE
    {
        // RealChute supplies the "Show Parachute Editor" PAW event.
        // No SIZE; custom case type keeps RealChute away from body variants.
        name = ProceduralChute
        textureLibrary = RealChute
        type = CrewChute
        currentCanopies = Main chute, Drogue chute
        currentCanopyModels = Single chute, Single chute
        currentTypes = Main, Drogue
    }

    MODULE
    {
        name = ModulePartVariants
        baseVariant = Black
        useMultipleDragCubes = false

        VARIANT
        {
            name = Black
            displayName = #LOC_Koffee_SmallCrewChute_Variant_Black
            primaryColor = #222222
            secondaryColor = #111111
            TEXTURE
            {
                materialName = SmallCrewChuteBody_Mat
                mainTextureURL = ShoAerospace/Koffee/Parts/SmallCrewChute/SmallCrewChute_MainBody_Black
            }
            TEXTURE
            {
                materialName = SmallCrewChute_Cap.Mat
                mainTextureURL = ShoAerospace/Koffee/Parts/SmallCrewChute/SmallCrewChute_Cap_Black
            }
        }
        VARIANT
        {
            name = White
            displayName = #LOC_Koffee_SmallCrewChute_Variant_White
            primaryColor = #ffffff
            secondaryColor = #dddddd
            TEXTURE
            {
                materialName = SmallCrewChuteBody_Mat
                mainTextureURL = ShoAerospace/Koffee/Parts/SmallCrewChute/SmallCrewChute_MainBody_White
            }
            TEXTURE
            {
                materialName = SmallCrewChute_Cap.Mat
                mainTextureURL = ShoAerospace/Koffee/Parts/SmallCrewChute/SmallCrewChute_Cap_White
            }
        }
        VARIANT
        {
            name = Gray
            displayName = #LOC_Koffee_SmallCrewChute_Variant_Gray
            primaryColor = #888888
            secondaryColor = #666666
            TEXTURE
            {
                materialName = SmallCrewChuteBody_Mat
                mainTextureURL = ShoAerospace/Koffee/Parts/SmallCrewChute/SmallCrewChute_MainBody_Gray
            }
            TEXTURE
            {
                materialName = SmallCrewChute_Cap.Mat
                mainTextureURL = ShoAerospace/Koffee/Parts/SmallCrewChute/SmallCrewChute_Cap_Gray
            }
        }
        VARIANT
        {
            name = WhiteNoSeams
            displayName = #LOC_Koffee_SmallCrewChute_Variant_WhiteNoSeams
            primaryColor = #ffffff
            secondaryColor = #ffffff
            TEXTURE
            {
                materialName = SmallCrewChuteBody_Mat
                mainTextureURL = ShoAerospace/Koffee/Parts/SmallCrewChute/SmallCrewChute_MainBody_White_NoSeams
            }
            TEXTURE
            {
                materialName = SmallCrewChute_Cap.Mat
                mainTextureURL = ShoAerospace/Koffee/Parts/SmallCrewChute/SmallCrewChute_Cap_White_NoSeams
            }
        }
    }

    EFFECTS
    {
        rcpredeploy
        {
            AUDIO
            {
                channel = Ship
                clip = sound_parachute_open
                volume = 1
            }
        }
        rcdeploy
        {
            AUDIO
            {
                channel = Ship
                clip = sound_parachute_single
                volume = 1
            }
        }
        rccut
        {
            AUDIO
            {
                channel = Ship
                clip = RealChute/Sounds/sound_parachute_cut
                volume = 1
            }
        }
        rcrepack
        {
            AUDIO
            {
                channel = Ship
                clip = RealChute/Sounds/sound_parachute_repack
                volume = 1
            }
        }
    }
}
