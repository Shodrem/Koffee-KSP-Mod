    category = Utility
    subcategory = 0
    title = #LOC_Koffee_AirCleanerLiteRadial_Title
    manufacturer = #LOC_Koffee_Manufacturer
    description = #LOC_Koffee_AirCleanerLiteRadial_Description
    tags = #LOC_Koffee_AirCleanerLite_Tags
    // Same mass and service balance as the inline Air Cleaner Lite.
    mass = 0.05
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.15
    angularDrag = 2
    crashTolerance = 12
    maxTemp = 1200
    explosionPotential = 0
    MODULE
    {
        name = ModuleKomfortService
        service = Air
        capacity = 1
        electricChargePerSecond = 0.02
        // Three hours initially; technology upgrades extend service life.
        lifetimeSeconds = 10800
        indicatorTransforms = Green_light
        overloadIndicatorTransforms = Oarnge_light
    }
    MODULE
    {
        name = ModuleKoffeePowerConsumer
    }
}
