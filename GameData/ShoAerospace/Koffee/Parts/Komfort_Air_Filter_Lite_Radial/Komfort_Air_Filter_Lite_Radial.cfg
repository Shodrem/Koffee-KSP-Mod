PART
{
    name = SHOKomfortAirFilterLiteRadial
    module = Part
    author = SHO Aerospace
    MODEL
    {
        model = ShoAerospace/Koffee/Parts/Komfort_Air_Filter_Lite_Radial/Air_Cleaner_Lite_AFL-R
    }
    scale = 1
    rescaleFactor = 0.75
    // Exported surface_attach position and +Z direction in Unity coordinates.
    node_attach = 0, -0.151299998, 0, 0, -1, 0, 0
    attachRules = 0,1,0,1,0
    bulkheadProfiles = srf
    TechRequired = start
    entryCost = 0
