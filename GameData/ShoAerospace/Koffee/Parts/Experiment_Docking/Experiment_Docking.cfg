PART
{
    name = SHOExperimentDockingED06
    module = Part
    author = ShoAerospace

    MODEL
    {
        model = ShoAerospace/Koffee/Parts/Experiment_Docking/SHO_Experiment_Docker_ED-06
        scale = 1, 1, 1
        // KSP resets the exported root rotation; restore the 180-degree Y turn.
        rotation = 0, 180, 0
    }
    scale = 1
    rescaleFactor = 1

    // Exported local +Z defines the outward direction on each side.
    NODE
    {
        name = top
        transform = attach_Docking
        size = 0
        method = FIXED_JOINT
    }
    NODE
    {
        name = bottom
        transform = attach_Backside
        size = 0
        method = FIXED_JOINT
    }
    // Rear empty measured after the Y rotation, facing +Z.
    node_attach = 0, 0, 0.003661202, 0, 0, 1, 0
    attachRules = 1,1,1,1,0

    // Balance and inventory reference: stock Clamp-O-Tron Jr.
    TechRequired = koffeeHardware
    entryCost = 7800
    cost = 800
    category = Coupling
    subcategory = 0
    title = #LOC_Koffee_ExperimentDockingED06_Title
    manufacturer = #LOC_Koffee_ExperimentDockingED06_Manufacturer
    description = #LOC_Koffee_ExperimentDockingED06_Description
    tags = #LOC_Koffee_ExperimentDockingED06_Tags
    bulkheadProfiles = size0, srf

    mass = 0.02
    dragModelType = default
    maximum_drag = 0.25
    minimum_drag = 0.25
    angularDrag = 0.5
    crashTolerance = 10
    maxTemp = 2000
    stagingIcon = DECOUPLER_VERT

    // Same stock docking configuration as the integrated EB-25 ports.
    MODULE
    {
        name = ModuleDockingNode
        nodeTransformName = attach_Docking
        controlTransformName = attach_Docking
        referenceAttachNode = top
        nodeType = size0
        gendered = false
        stagingEnabled = false
        canRotate = false
    }
    MODULE
    {
        name = ModuleCargoPart
        packedVolume = 140
    }
}
