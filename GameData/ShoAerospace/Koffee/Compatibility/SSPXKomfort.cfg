// User scope: all SSPX crew spaces except greenhouses; functional labs obey
// the global lab-seat option. No part clones, renamed manufacturers or beds.
// Zero-capacity structures contribute zero; deployed capacity is read below.
@PART[sspx-*]:NEEDS[StationPartsExpansionRedux]:BEFORE[Koffee]
{
    %MODULE[ModuleKomfortHabitat]
    {
        %name = ModuleKomfortHabitat
        %eligible = true
    }
}

// Checked against the installed CFGs: these five IDs are greenhouses.
// Their crew still contributes to N, but their work spaces do not add P.
@PART[sspx-greenhouse-25-1|sspx-greenhouse-375-1|sspx-greenhouse-5-1|sspx-dome-greenhouse-5-1|sspx-cupola-greenhouse-125-1]:NEEDS[StationPartsExpansionRedux]:BEFORE[Koffee]
{
    @MODULE[ModuleKomfortHabitat]
    {
        %eligible = false
    }
}

// HabUtils.SetCrewCapacity(bool) selects these fields; Deployed is persisted.
// All installed retracted capacities are zero. Copy configured capacities,
// never infer them from the name or freeze seats in the craft/save.
@PART[sspx-*]:HAS[@MODULE[ModuleDeployableHabitat]]:NEEDS[StationPartsExpansionRedux]:BEFORE[Koffee]
{
    @MODULE[ModuleKomfortHabitat]
    {
        %deploymentModule = ModuleDeployableHabitat
        %deployedCapacity = #$/MODULE[ModuleDeployableHabitat]/DeployedCrewCapacity$
        %retractedCapacity = 0
    }
}
@PART[sspx-*]:HAS[@MODULE[ModuleDeployableCentrifuge]]:NEEDS[StationPartsExpansionRedux]:BEFORE[Koffee]
{
    @MODULE[ModuleKomfortHabitat]
    {
        %deploymentModule = ModuleDeployableCentrifuge
        %deployedCapacity = #$/MODULE[ModuleDeployableCentrifuge]/DeployedCrewCapacity$
        %retractedCapacity = 0
    }
}
