// Same exclusive paid-heat backend as climate; no ModuleCoreHeat, reactor or
// second AddFlux source is added. Koffee's legacy internal loop ID is retained.
@PART[*]:HAS[@MODULE[ModuleEmergencySupport]:HAS[~generationBackend[SystemHeatFissionReactor]],!MODULE[ModuleSystemHeat]:HAS[#moduleID[KoffeeClimate]]]:NEEDS[SystemHeat]:AFTER[KoffeeEmergencySupport]
{
    MODULE
    {
        name = ModuleSystemHeat
        moduleID = KoffeeClimate
        iconName = Icon_Gears
        volume = 0.05
        currentLoopID = 0
    }
}
