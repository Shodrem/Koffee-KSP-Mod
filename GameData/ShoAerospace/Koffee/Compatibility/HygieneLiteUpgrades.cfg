PARTUPGRADE
{
    name = KoffeeHygieneLiteDurability1
    partIcon = SHOKomfortHygieneLite
    techRequired = survivability
    entryCost = 2000
    cost = 0
    title = #LOC_Koffee_HygieneLiteUpgrade1_Title
    basicInfo = #LOC_Koffee_HygieneLiteUpgrade1_Info
    manufacturer = #LOC_Koffee_Manufacturer
    description = #LOC_Koffee_HygieneLiteUpgrade1_Description
}

PARTUPGRADE
{
    name = KoffeeHygieneLiteDurability2
    partIcon = SHOKomfortHygieneLite
    techRequired = basicScience
    entryCost = 5000
    cost = 0
    title = #LOC_Koffee_HygieneLiteUpgrade2_Title
    basicInfo = #LOC_Koffee_HygieneLiteUpgrade2_Info
    manufacturer = #LOC_Koffee_Manufacturer
    description = #LOC_Koffee_HygieneLiteUpgrade2_Description
}

@PARTUPGRADE[KoffeeHygieneLiteDurability2]:NEEDS[CommunityTechTree]:AFTER[CommunityTechTree]
{
    @techRequired = enhancedSurvivability
}

@PART[SHOKomfortHygieneLite]:AFTER[Koffee]
{
    @MODULE[ModuleKomfortService]
    {
        UPGRADES
        {
            UPGRADE
            {
                name__ = KoffeeHygieneLiteDurability1
                description__ = #LOC_Koffee_HygieneLiteUpgrade1_Info
                lifetimeSeconds = 172800
            }
            UPGRADE
            {
                name__ = KoffeeHygieneLiteDurability2
                description__ = #LOC_Koffee_HygieneLiteUpgrade2_Info
                lifetimeSeconds = 604800
            }
        }
    }
}
