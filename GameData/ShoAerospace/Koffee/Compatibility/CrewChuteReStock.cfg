// Match the ReStock 1.25 m diameter: 1.25 / 1.175 = 50 / 47.
// Scale the body (including caps and collider) radially only.
// Height and exported attach_North/attach_South stay unchanged; canopy sizes stay unchanged.
@PART[SHOCrewChute125]:NEEDS[ReStock,RealChute]:AFTER[ReStock]
{
    @MODEL:HAS[#model[ShoAerospace/Koffee/Parts/CrewChute/CrewChute]]
    {
        @scale = 1.063829787234043, 1, 1.063829787234043
    }

    // Follow Main_Exit and Drogue_Exit after scaling the body in X/Z.
    @MODEL:HAS[#model[RealChute/Parts/model_RC_canopy]]
    {
        @position = 0, 0.178237543, 0.544839463830
    }
    @MODEL:HAS[#model[RealChute/Parts/model_RC_canopy2]]
    {
        @position = 0, 0.210658655, -0.552193661702
    }
}
