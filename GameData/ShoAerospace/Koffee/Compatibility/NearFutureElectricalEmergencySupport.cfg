// NFE 2.x uses SystemHeat's native fission reactor. Keep the stock backend when
// either dependency is absent. Fuel/waste tanks hold 0.3 units; fuel rate scales with output.
@PART[*]:HAS[@MODULE[ModuleEmergencySupport],@MODULE[ModuleGenerator],!MODULE[ModuleSystemHeatFissionReactor]]:NEEDS[NearFutureElectrical,SystemHeat]:LAST[KoffeeEmergencySupport]
{
    @MODULE[ModuleEmergencySupport]
    {
        %generationBackend = SystemHeatFissionReactor
        // Scale the inspected 200 EC/s NFE reactor's 1.30e-7 u/s fuel rate.
        %reactorFuelPerSecond = #$electricChargePerSecond$
        @reactorFuelPerSecond *= 0.00000000065
    }
    !MODULE[ModuleGenerator],* {}
    !MODULE[ModuleSystemHeat]:HAS[#moduleID[KoffeeClimate]] {}
    @MODULE[ModuleKomfortService]:HAS[#service[Emergency]]
    {
        // The native reactor supplies waste heat; never add Koffee heat as well.
        @heatKilowattsPerKerbal = 0
    }
    MODULE
    {
        name = ModuleSystemHeat
        moduleID = KoffeeEmergencyReactor
        iconName = Icon_Nuclear
        volume = 0.05
        currentLoopID = 0
    }
    MODULE
    {
        name = ModuleSystemHeatFissionReactor
        moduleID = KoffeeEmergencyReactor
        systemHeatModuleID = KoffeeEmergencyReactor
        Enabled = false
        FirstLoad = false
        ManualControl = true
        allowManualControl = false
        allowHibernate = false
        HibernateOnWarp = false
        CurrentReactorThrottle = 100
        CurrentThrottle = 0
        MinimumThrottle = 100
        ThrottleIncreaseRate = 10000
        ThrottleDecreaseRate = 10000
        GeneratesElectricity = true
        FuelName = EnrichedUranium
        NominalTemperature = 750
        CriticalTemperature = 1300
        MaximumTemperature = 2000
        CurrentSafetyOverride = 1300
        CoreDamageRate = 0.008
        RepairAmountPerKit = 25
        HeatGeneration
        {
            key = 0 0
            key = 100 1
            @key,1[1, ] = #$../../MODULE[ModuleEmergencySupport]/heatKilowatts$
            @key,1[1, ] += #$../../MODULE[ModuleEmergencySupport]/electricChargePerSecond$
        }
        ElectricalGeneration
        {
            key = 0 0
            key = 100 1
            @key,1[1, ] = #$../../MODULE[ModuleEmergencySupport]/electricChargePerSecond$
        }
        INPUT_RESOURCE
        {
            ResourceName = EnrichedUranium
            Ratio = #$../../MODULE[ModuleEmergencySupport]/reactorFuelPerSecond$
            FlowMode = NO_FLOW
        }
        OUTPUT_RESOURCE
        {
            ResourceName = DepletedFuel
            Ratio = #$../../MODULE[ModuleEmergencySupport]/reactorFuelPerSecond$
            DumpExcess = false
            FlowMode = NO_FLOW
        }
    }
    RESOURCE
    {
        name = EnrichedUranium
        // At 5 EC/s, 0.3 units cover ten Kerbin years plus the runtime reserve.
        amount = 0.3
        maxAmount = 0.3
    }
    RESOURCE
    {
        name = DepletedFuel
        amount = 0
        maxAmount = #$../RESOURCE[EnrichedUranium]/maxAmount$
    }
    MODULE
    {
        name = ModuleSystemHeatFissionFuelContainer
        EngineerLevelForTransfer = 3
        ResourceNames = EnrichedUranium, DepletedFuel
    }
}
