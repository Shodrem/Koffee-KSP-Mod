// The climate source replaces stock heat only when the optional plugin exists.
// Native service PARTs are loaded before the Koffee compatibility pass.
@PART[*]:HAS[@MODULE[ModuleKomfortService]:HAS[#service[Climate]],!MODULE[ModuleSystemHeat]:HAS[#moduleID[KoffeeClimate]]]:NEEDS[SystemHeat]:AFTER[Koffee]
{
    MODULE
    {
        name = ModuleSystemHeat
        moduleID = KoffeeClimate
        iconName = Icon_Gears
        // Coolant volume (m3), distinct from cabin/habitat volume.
        volume = 0.05
        currentLoopID = 0
    }
}
