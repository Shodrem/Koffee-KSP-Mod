// Software contract for the user's forthcoming model. This creates no PART and
// changes no existing part unless it explicitly declares ModuleEmergencySupport.
@PART[*]:HAS[@MODULE[ModuleEmergencySupport]:HAS[~electricChargePerSecond[]]]:FOR[KoffeeEmergencySupport]
{
    @MODULE[ModuleEmergencySupport]
    {
        electricChargePerSecond = 0.1
    }
}
@PART[*]:HAS[@MODULE[ModuleEmergencySupport]:HAS[~heatKilowatts[]]]:FOR[KoffeeEmergencySupport]
{
    @MODULE[ModuleEmergencySupport]
    {
        heatKilowatts = 0.5
    }
}
@PART[*]:HAS[@MODULE[ModuleEmergencySupport],!MODULE[ModuleKomfortService]]:AFTER[KoffeeEmergencySupport]
{
    MODULE
    {
        name = ModuleKomfortService
        service = Emergency
        capacity = 2
        serviceEnabled = false
        electricChargePerSecond = #$../MODULE[ModuleEmergencySupport]/electricChargePerSecond$
        heatKilowattsPerKerbal = #$../MODULE[ModuleEmergencySupport]/heatKilowatts$
    }
}
// PB-NUK and NFE 2.0 RTGs both use ModuleGenerator in the inspected installation.
// The shared network handles output; Koffee never reserves or manufactures EC.
@PART[*]:HAS[@MODULE[ModuleEmergencySupport]:HAS[~generationBackend[SystemHeatFissionReactor]],!MODULE[ModuleGenerator]]:AFTER[KoffeeEmergencySupport]
{
    MODULE
    {
        name = ModuleGenerator
        isAlwaysActive = false
        generatorIsActive = false
        OUTPUT_RESOURCE
        {
            name = ElectricCharge
            rate = #$../../MODULE[ModuleEmergencySupport]/electricChargePerSecond$
        }
    }
}
// DBS publishes the separate Komfort service tariff through this zero-own-cost
// marker. The marker never adds a second EC charge.
@PART[*]:HAS[@MODULE[ModuleEmergencySupport],!MODULE[ModuleKoffeePowerConsumer]]:AFTER[KoffeeEmergencySupport]
{
    MODULE
    {
        name = ModuleKoffeePowerConsumer
        electricChargePerSecond = 0
    }
}
