// Optional SSPX resource storage: one cup per unit of B9 container volume.
// Preserve the part's structural mass/cost and all existing cargo choices.
B9_TANK_TYPE:NEEDS[Koffee,StationPartsExpansionRedux,B9PartSwitch]
{
    name = KoffeeSSPX
    tankMass = 0
    tankCost = 0
    RESOURCE
    {
        name = Koffee
        unitsPerVolume = 1
    }
}

@PART[sspx-cargo-container*,sspx-logistics*]:HAS[@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[cargoSwitch]]]:NEEDS[Koffee,StationPartsExpansionRedux,B9PartSwitch]:AFTER[StationPartsExpansionRedux]
{
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[cargoSwitch],!SUBTYPE[Koffee]]
    {
        SUBTYPE
        {
            name = Koffee
            tankType = KoffeeSSPX
            title = #Koffee_Resource_DisplayName
            primaryColor = #6F4E37
            secondaryColor = #D9C4A5
            transform = OreDecal

            TEXTURE
            {
                transform = OreDecal
                texture = ShoAerospace/Koffee/Compatibility/SSPX/koffee-decal-draft
            }
        }
    }
}
