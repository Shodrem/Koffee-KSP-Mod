// Optional CLS support for Koffee crewed parts and the full-size crew chute.
// Only stack connections are internal passages; surface attachments stay blocked.
@PART[SHOAdvancedLab25Test,SHOSpaceLabKF01,SHOCrewChute125]:HAS[!MODULE[ModuleConnectedLivingSpace]]:NEEDS[ConnectedLivingSpace]:AFTER[ConnectedLivingSpace]
{
    MODULE
    {
        name = ModuleConnectedLivingSpace
        passable = true
        passableWhenSurfaceAttached = false
        surfaceAttachmentsPassable = false
    }
}

// The telescope's bottom node leads into the crew cabin. Equipment mounts do not.
@PART[SHOSpaceTelescopeSTS25]:HAS[!MODULE[ModuleConnectedLivingSpace]]:NEEDS[ConnectedLivingSpace]:AFTER[ConnectedLivingSpace]
{
    MODULE
    {
        name = ModuleConnectedLivingSpace
        passable = true
        impassablenodes = autopilot, experiment
        passableWhenSurfaceAttached = false
        surfaceAttachmentsPassable = false
    }
}

// The 0.625 m chute has no internal crew passage.
@PART[SHOSmallCrewChute0625]:HAS[!MODULE[ModuleConnectedLivingSpace]]:NEEDS[ConnectedLivingSpace]:AFTER[ConnectedLivingSpace]
{
    MODULE
    {
        name = ModuleConnectedLivingSpace
        passable = false
        passableWhenSurfaceAttached = false
        surfaceAttachmentsPassable = false
    }
}
