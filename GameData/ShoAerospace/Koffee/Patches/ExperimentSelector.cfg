// Dedicated PARTs are configuration catalog and stock R&D records.
// Clone physical hardware before converting the dedicated records to free unlocks.
+PART[koffeeExperimentContainer_ContainerIntegrity]:FINAL
{
    @name = koffeeConfigurableExperimentContainer
    @category = Science
    @title = #Koffee_Selector_ContainerTitle
    @description = #Koffee_Selector_ContainerDescription
    @manufacturer = #LOC_Koffee_Manufacturer
    @tags = #Koffee_Selector_ContainerTags
    @MODULE[ModuleKoffeeExperiment]
    {
        @experimentID =
        %editorExperimentFamily = Container
        %surfaceEnabled = true
        !UPGRADES,* {}
    }
    MODULE
    {
        name = ModuleKoffeeExperimentSelector
    }
}

@PART[SHOExperimentDeviceED01]:FINAL
{
    // Follow the effective first device technology, from the default Koffee tree.
    @TechRequired = #$@PART[koffeeExperimentContainer_ExtendedCrewStudy]/TechRequired$
    MODULE
    {
        name = ModuleKoffeeExperiment
        editorExperimentFamily = Device
        experimentID =
    }
    MODULE
    {
        name = ModuleKoffeeExperimentSelector
    }
}

@PART[*]:HAS[@MODULE[ModuleKoffeeExperiment]:HAS[~editorExperimentFamily[]]]:FINAL
{
    @category = none
    %TechHidden = false
    @entryCost = 0
    %identicalParts =
    MODULE
    {
        name = ModuleKoffeeExperimentConfiguration
        hardwareModel = #$../MODEL/model$
    }
}
