// Koffee - Stock and SSPX Laboratory Balance
//
// The stock MPL-LG-2 and the three supported SSPX laboratories use:
//
//     scienceMultiplier = 5
//
// This optional file applies only to the stock MPL-LG-2 and those SSPX labs.
// It reduces only that value to:
//
//     scienceMultiplier = 2
//
// This affects the amount of Science generated from processed Data. It does not
// change dataProcessingMultiplier, researchTime, scientistBonus, scienceCap,
// ElectricCharge consumption, Data capacity or crew requirements.
//
// Delete this file, rename its extension, or move it outside GameData to restore
// the original laboratory balance.
@PART[Large_Crewed_Lab]:NEEDS[Koffee]:AFTER[Squad]
{
    @MODULE[ModuleScienceConverter]
    {
        @scienceMultiplier = 2
    }
}

// Apply the same optional science reduction to supported SSPX laboratories.
// Independent of the Koffee marker; no experiment upgrade requirement is added.
@PART[sspx-lab-5-1,sspx-lab-375-1,sspx-science-1875-1]:HAS[@MODULE[ModuleScienceConverter]]:NEEDS[Koffee,StationPartsExpansionRedux]:AFTER[StationPartsExpansionRedux]
{
    @MODULE[ModuleScienceConverter]
    {
        @scienceMultiplier = 2
    }
}
