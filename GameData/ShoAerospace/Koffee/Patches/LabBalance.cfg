// Common balance for every native stock converter, including all modules on a part.
// Other capacity, processing, contextual bonuses, crew and electricity stay configured.
@PART[*]:HAS[@MODULE[ModuleScienceConverter]]:NEEDS[Koffee]:FINAL
{
    @MODULE[ModuleScienceConverter],*
    {
        @scienceMultiplier = 2
    }
}
