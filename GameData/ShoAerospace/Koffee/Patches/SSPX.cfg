// All SSPX laboratory roles, air filtration, localization and instant science.
// Classify before Koffee's storage pass; preserve technology and stock modules.
// LabBalance.cfg independently controls the optional converter multiplier.
@PART[sspx-lab-5-1,sspx-greenhouse-5-1,sspx-lab-375-1,sspx-greenhouse-375-1,sspx-science-1875-1]:HAS[!MODULE[ModuleKoffeeLab]]:NEEDS[Koffee,StationPartsExpansionRedux]:BEFORE[Koffee]
{
    MODULE
    {
        name = ModuleKoffeeLab
    }
}

@PART[sspx-lab-5-1]:NEEDS[Koffee,StationPartsExpansionRedux]:BEFORE[Koffee]
{
    @title = #LOC_Koffee_SSPX_Delphi_Title
    @description = #LOC_Koffee_SSPX_Delphi_Description
    @MODULE[ModuleKoffeeLab]
    {
        %stationCapabilities = BiGEn,MaPhyTec
    }
}

@PART[sspx-greenhouse-5-1]:NEEDS[Koffee,StationPartsExpansionRedux]:BEFORE[Koffee]
{
    @title = #LOC_Koffee_SSPX_Demeter_Title
    @description = #LOC_Koffee_SSPX_Demeter_Description
    @MODULE[ModuleKoffeeLab]
    {
        %stationCapabilities = BiGEn,MaPhyTec
    }
}

@PART[sspx-lab-375-1]:NEEDS[Koffee,StationPartsExpansionRedux]:BEFORE[Koffee]
{
    @title = #LOC_Koffee_SSPX_Fate_Title
    @description = #LOC_Koffee_SSPX_Fate_Description
    @MODULE[ModuleKoffeeLab]
    {
        %stationCapabilities = MaPhyTec
    }
}

@PART[sspx-greenhouse-375-1]:NEEDS[Koffee,StationPartsExpansionRedux]:BEFORE[Koffee]
{
    @title = #LOC_Koffee_SSPX_Rancher_Title
    @description = #LOC_Koffee_SSPX_Rancher_Description
    @MODULE[ModuleKoffeeLab]
    {
        %stationCapabilities = BiGEn
    }
}

@PART[sspx-science-1875-1]:NEEDS[Koffee,StationPartsExpansionRedux]:BEFORE[Koffee]
{
    @title = #LOC_Koffee_SSPX_Nature_Title
    @description = #LOC_Koffee_SSPX_Nature_Description
    @MODULE[ModuleKoffeeLab]
    {
        %stationCapabilities = StationBasic
    }
}

// The 2.5 m greenhouse also filters cabin air for four Kerbals. Preserve its
// seats, technology and instant plant-growth experiment; no Hygiene service.
@PART[sspx-greenhouse-25-1]:HAS[!MODULE[ModuleKomfortService]]:NEEDS[Koffee,StationPartsExpansionRedux]:BEFORE[Koffee]
{
    @title = #LOC_Koffee_SSPX_Farm_Title
    @description = #LOC_Koffee_SSPX_Farm_Description
    MODULE
    {
        name = ModuleKomfortService
        service = Air
        capacity = 4
        electricChargePerSecond = 0.02
        maintenanceKits = 1
    }
    %MODULE[ModuleKoffeePowerConsumer]
    {
        %name = ModuleKoffeePowerConsumer
    }
}

// Utility-module services. Crew seats remain operating positions, independent
// of service capacity. Existing crewReport already uses the stock Koffee rule.
@PART[sspx-utility-125-1]:HAS[!MODULE[ModuleKomfortService]]:NEEDS[Koffee,StationPartsExpansionRedux]:BEFORE[Koffee]
{
    @title = #LOC_Koffee_SSPX_Star_Title
    @description = #LOC_Koffee_SSPX_Star_Description
    MODULE
    {
        name = ModuleKomfortService
        service = Climate
        capacity = 2
        electricChargePerSecond = 0.02
        heatKilowattsPerKerbal = 5
        maintenanceKits = 1
    }
    %MODULE[ModuleKoffeePowerConsumer]
    {
        %name = ModuleKoffeePowerConsumer
    }
}

@PART[sspx-utility-1875-1]:HAS[!MODULE[ModuleKomfortService]]:NEEDS[Koffee,StationPartsExpansionRedux]:BEFORE[Koffee]
{
    @title = #LOC_Koffee_SSPX_Spectra_Title
    @description = #LOC_Koffee_SSPX_Spectra_Description
    MODULE
    {
        name = ModuleKomfortService
        service = Climate
        capacity = 4
        electricChargePerSecond = 0.04
        heatKilowattsPerKerbal = 5
        maintenanceKits = 1
    }
    MODULE
    {
        name = ModuleKomfortService
        service = Air
        capacity = 4
        electricChargePerSecond = 0.02
        maintenanceKits = 1
    }
    %MODULE[ModuleKoffeePowerConsumer]
    {
        %name = ModuleKoffeePowerConsumer
    }
}

// Plain Localization is read by KSP before ModuleManager. These private keys
// are only referenced by the conditional part patches above.
Localization
{
    en-us
    {
        #LOC_Koffee_SSPX_Star_Title = PAS-6 'Star' Climate Service Module
        #LOC_Koffee_SSPX_Star_Description = This compact utility module provides climate control for two Kerbals throughout the vessel. It consumes 0.02 EC/s while operating and releases 5 kW of heat per Kerbal served, up to 10 kW. It uses the standard service maintenance cycle, with one repair kit per intervention. Its single seat is an operating position. It retains its electrical and RCS fuel storage and instant crew report, which follows the standard Koffee scientist activation rule. The engineer can still poke their head in to check that things are not going too wrong.
        #LOC_Koffee_SSPX_Spectra_Title = PMA-3 'Spectra' Climate and Air Filtration Module
        #LOC_Koffee_SSPX_Spectra_Description = A combined technical service module providing climate control and cabin air filtration for four Kerbals throughout the vessel. Climate control consumes 0.04 EC/s and releases 5 kW of heat per Kerbal served, up to 20 kW. Air filtration consumes another 0.02 EC/s, for 0.06 EC/s with both services operating. Each service has its own operating switch and standard maintenance cycle, with one repair kit per intervention. It retains its two operating seats, electrical and fuel storage and instant crew report, which follows the standard Koffee scientist activation rule. The crew would prefer the engineer to keep the boilers metaphorical.
        #LOC_Koffee_SSPX_Farm_Title = PPD-F412M Hydroponics and Air Filtration Module
        #LOC_Koffee_SSPX_Farm_Description = This hydroponic module combines orbital cultivation with cabin air filtration for four Kerbals. Its two seats are operating positions; the filter serves the crew throughout the vessel. Filtration consumes 0.02 EC/s and uses the standard service maintenance cycle, with one repair kit per maintenance. It retains the instant plant growth experiment, which requires a scientist activated with Koffee under the stock experiment rule. The kale remains an acquired taste.
        #LOC_Koffee_SSPX_Delphi_Title = SDV-6 'Delphi' BiGEn / MaPhyTec Laboratory
        #LOC_Koffee_SSPX_Delphi_Description = A spacious combined laboratory with four shared scientific workstations for BiGEn and MaPhyTec Koffee experiments. Its payload racks and remote telescope complement the internal research facilities. It retains SSPX data processing, science conversion and instant telescope observations. Instant observations follow the standard Koffee scientist activation rule.
        #LOC_Koffee_SSPX_Demeter_Title = SDV-4 'Demeter' BiGEn / MaPhyTec Laboratory
        #LOC_Koffee_SSPX_Demeter_Description = This large cultivation module combines hydroponics, aquaculture and research equipment in a combined BiGEn and MaPhyTec laboratory. Its four scientific workstations are shared between both specialties. It retains the instant plant growth experiment, which follows the standard Koffee scientist activation rule. The kale remains available for experiments and questionable salads.
        #LOC_Koffee_SSPX_Fate_Title = PXL-2 'Fate' MaPhyTec Laboratory
        #LOC_Koffee_SSPX_Fate_Description = A deep-space laboratory with three scientific workstations for MaPhyTec Koffee experiments in technology, materials, chemistry and physics. Its experiment airlock complements the internal facilities, and integrated EVA rails help with exterior work. It retains SSPX data processing and science conversion.
        #LOC_Koffee_SSPX_Rancher_Title = PXL-R4NCH-3R BiGEn Laboratory
        #LOC_Koffee_SSPX_Rancher_Description = A laboratory with three scientific workstations for BiGEn Koffee experiments in biology, geology and environment. Its hydroponic facilities support biological work alongside the laboratory's other research. It retains the instant plant growth experiment, which follows the standard Koffee scientist activation rule, and its integrated EVA rails. There is still more kale than the crew requested.
        #LOC_Koffee_SSPX_Nature_Title = PMA-4 'Nature' Basic Laboratory
        #LOC_Koffee_SSPX_Nature_Description = A compact level I laboratory with two scientific workstations for StationBasic Koffee experiments. It provides basic research facilities without BiGEn or MaPhyTec specialization. It retains SSPX data processing and science conversion. Identifying the mould is still a perfectly respectable research objective.
    }
    es-es
    {
        #LOC_Koffee_SSPX_Star_Title = Módulo de climatización PAS-6 «Star»
        #LOC_Koffee_SSPX_Star_Description = Este compacto módulo auxiliar proporciona climatización para dos Kerbals de toda la nave. Consume 0,02 EC/s mientras funciona y libera 5 kW de calor por Kerbal atendido, hasta 10 kW. Sigue el ciclo habitual de mantenimiento de servicios, con un kit de reparación por intervención. Su único asiento es un puesto de operación. Conserva sus reservas de electricidad y combustible RCS y el informe de tripulación instantáneo, que sigue la regla habitual de activación del científico con Koffee. El ingeniero todavía puede asomar la cabeza para comprobar que las cosas no van demasiado mal.
        #LOC_Koffee_SSPX_Spectra_Title = Módulo de climatización y filtrado de aire PMA-3 «Spectra»
        #LOC_Koffee_SSPX_Spectra_Description = Un módulo de servicios técnicos que combina climatización y filtrado del aire de cabina para cuatro Kerbals de toda la nave. La climatización consume 0,04 EC/s y libera 5 kW de calor por Kerbal atendido, hasta 20 kW. El filtrado consume otros 0,02 EC/s: ambos servicios operativos suman 0,06 EC/s. Cada servicio dispone de su propio interruptor y ciclo habitual de mantenimiento, con un kit de reparación por intervención. Conserva sus dos puestos de operación, las reservas de electricidad y combustible y el informe de tripulación instantáneo, que sigue la regla habitual de activación del científico con Koffee. La tripulación prefiere que las calderas que vigila el ingeniero sean metafóricas.
        #LOC_Koffee_SSPX_Farm_Title = Módulo hidropónico y de filtrado de aire PPD-F412M
        #LOC_Koffee_SSPX_Farm_Description = Este módulo hidropónico combina el cultivo orbital con el filtrado del aire de cabina para cuatro Kerbals. Sus dos asientos son puestos de operación; el filtro atiende a la tripulación de toda la nave. El filtrado consume 0,02 EC/s y sigue el ciclo habitual de mantenimiento de servicios, con un kit de reparación por mantenimiento. Conserva el experimento instantáneo de crecimiento vegetal, que requiere un científico activado con Koffee según la regla de los experimentos stock. La col rizada sigue siendo un gusto adquirido.
        #LOC_Koffee_SSPX_Delphi_Title = Laboratorio BiGEn / MaPhyTec SDV-6 «Delphi»
        #LOC_Koffee_SSPX_Delphi_Description = Un amplio laboratorio combinado con cuatro puestos científicos compartidos para experimentos Koffee de BiGEn y MaPhyTec. Sus soportes de carga y su telescopio remoto complementan las instalaciones interiores. Conserva el procesamiento de datos, la conversión científica y la observación telescópica instantánea de SSPX. Las observaciones instantáneas siguen la regla habitual de activación del científico con Koffee.
        #LOC_Koffee_SSPX_Demeter_Title = Laboratorio BiGEn / MaPhyTec SDV-4 «Demeter»
        #LOC_Koffee_SSPX_Demeter_Description = Este gran módulo de cultivo reúne hidroponía, acuicultura e instrumental de investigación en un laboratorio combinado BiGEn y MaPhyTec. Sus cuatro puestos científicos se comparten entre ambas especialidades. Conserva el experimento instantáneo de crecimiento vegetal, que sigue la regla habitual de activación del científico con Koffee. La col rizada sigue disponible para experimentos y ensaladas cuestionables.
        #LOC_Koffee_SSPX_Fate_Title = Laboratorio MaPhyTec PXL-2 «Fate»
        #LOC_Koffee_SSPX_Fate_Description = Un laboratorio de espacio profundo con tres puestos científicos para experimentos Koffee de MaPhyTec sobre tecnología, materiales, química y física. Su esclusa de experimentos complementa las instalaciones interiores y los raíles EVA integrados facilitan el trabajo exterior. Conserva el procesamiento de datos y la conversión científica de SSPX.
        #LOC_Koffee_SSPX_Rancher_Title = Laboratorio BiGEn PXL-R4NCH-3R
        #LOC_Koffee_SSPX_Rancher_Description = Un laboratorio con tres puestos científicos para experimentos Koffee de BiGEn sobre biología, geología y entorno. Sus instalaciones hidropónicas permiten realizar trabajos biológicos junto a las demás investigaciones del laboratorio. Conserva el experimento instantáneo de crecimiento vegetal, que sigue la regla habitual de activación del científico con Koffee, y sus raíles EVA integrados. Sigue habiendo más col rizada de la que pidió la tripulación.
        #LOC_Koffee_SSPX_Nature_Title = Laboratorio básico PMA-4 «Nature»
        #LOC_Koffee_SSPX_Nature_Description = Un laboratorio compacto de nivel I con dos puestos científicos para experimentos Koffee de StationBasic. Ofrece instalaciones de investigación básica, sin especialización BiGEn ni MaPhyTec. Conserva el procesamiento de datos y la conversión científica de SSPX. Identificar el moho sigue siendo un objetivo científico perfectamente respetable.
    }
}
