// Koffee compatibility with Stockalike Station Parts Expansion Redux.
// Keep SSPX science modules; opt in to Koffee laboratory support.
// LabBalance.cfg separately applies the optional science multiplier reduction.
// Station experiment capacity follows each part's CrewCapacity (4, 3, 2).
@PART[sspx-lab-5-1,sspx-lab-375-1,sspx-science-1875-1]:HAS[@MODULE[ModuleScienceLab],@MODULE[ModuleScienceConverter],!MODULE[ModuleKoffeeLab]]:NEEDS[Koffee,StationPartsExpansionRedux]:AFTER[StationPartsExpansionRedux]
{
    MODULE
    {
        name = ModuleKoffeeLab
        stationCapabilities = StationBasic
    }
}
