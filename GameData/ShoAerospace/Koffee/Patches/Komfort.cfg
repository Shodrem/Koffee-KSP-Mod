// An INTERNAL declares a crew interior, not a bed count. Functional laboratory
// modules decide lab eligibility in code, once per part, never by title/name.
@PART[*]:HAS[#CrewCapacity[>0],@INTERNAL[*],!MODULE[ModuleKomfortHabitat]]:FINAL
{
    MODULE
    {
        name = ModuleKomfortHabitat
    }
}

@PART[*]:HAS[@MODULE[ModuleScienceLab],@MODULE[ModuleKomfortHabitat]]:FINAL
{
    @MODULE[ModuleKomfortHabitat]
    {
        %laboratory = true
    }
}
@PART[*]:HAS[@MODULE[ModuleKoffeeLab],@MODULE[ModuleKomfortHabitat]]:FINAL
{
    @MODULE[ModuleKomfortHabitat]
    {
        %laboratory = true
    }
}
