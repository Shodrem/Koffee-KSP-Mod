// All Managers share unlimited stock storage. Lite never has the advanced module.
@PART[*]:HAS[@MODULE[ModuleKoffeeExperimentManager],!MODULE[ModuleKoffeeScienceStore]]:NEEDS[Koffee]:FOR[KoffeeScienceStores]
{
    MODULE
    {
        name = ModuleKoffeeScienceStore
        lite = false
    }
    MODULE
    {
        name = ModuleScienceContainer
        capacity = 0
        reviewActionName = #Koffee_Reports_Review
        storeActionName = #Koffee_Reports_Collect
        canBeTransferredToInVessel = True
        canTransferInVessel = True
        allowRepeatedSubjects = False
        dataIsRecoverable = True
        dataIsCollectable = True
        dataIsStorable = True
        evaOnlyStorage = False
        storageRange = 1.3
    }
}
