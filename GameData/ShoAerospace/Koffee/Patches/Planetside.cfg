// Preserve Planetside seats, technology, interiors and stock functionality.
// Classify laboratories before Koffee's storage pass.
@PART[Benjee10_MMSEV_baseLab]:HAS[!MODULE[ModuleKoffeeLab]]:NEEDS[Koffee,Benjee10_MMSEV]:BEFORE[Koffee]
{
    MODULE
    {
        name = ModuleKoffeeLab
        stationCapabilities = StationBasic
    }
}

@PART[Benjee10_MMSEV_baseLab]:NEEDS[Koffee,Benjee10_MMSEV]:BEFORE[Koffee]
{
    @description = #LOC_Koffee_Planetside_Lab_Description
}

@PART[Benjee10_MMSEV_baseGreenhouse]:HAS[!MODULE[ModuleKomfortService]]:NEEDS[Koffee,Benjee10_MMSEV]:BEFORE[Koffee]
{
    @description = #LOC_Koffee_Planetside_Greenhouse_Description
    MODULE
    {
        name = ModuleKomfortService
        service = Air
        capacity = 4
        electricChargePerSecond = 0.02
        maintenanceKits = 1
    }
    %MODULE[ModuleKoffeePowerConsumer]
    {
        %name = ModuleKoffeePowerConsumer
    }
}

// The command node's six seats are independent of its service capacities.
// Logistics modules remain storage modules without additional services.
@PART[Benjee10_MMSEV_baseHDU]:HAS[!MODULE[ModuleKomfortService]]:NEEDS[Koffee,Benjee10_MMSEV]:BEFORE[Koffee]
{
    @description = #LOC_Koffee_Planetside_Command_Description
    MODULE
    {
        name = ModuleKomfortService
        service = Air
        capacity = 4
        electricChargePerSecond = 0.02
        maintenanceKits = 1
    }
    MODULE
    {
        name = ModuleKomfortService
        service = Hygiene
        capacity = 4
        electricChargePerSecond = 0.06
        maintenanceKits = 1
    }
    %MODULE[ModuleKoffeePowerConsumer]
    {
        %name = ModuleKoffeePowerConsumer
    }
}

Localization
{
    en-us
    {
        #LOC_Koffee_Planetside_Lab_Description = Science has never been easier with this surface laboratory module. It provides two scientific workstations for Koffee StationBasic experiments and retains its stock data processing, science conversion and crew experience management.
        #LOC_Koffee_Planetside_Greenhouse_Description = This hydroponics module uses its plants to enhance cabin air filtration for up to four Kerbals throughout the vessel. Filtration consumes 0.02 EC/s and uses the standard service maintenance cycle, with one repair kit per intervention. Its two crew seats and KerbNet access are retained.
        #LOC_Koffee_Planetside_Command_Description = This base command node also provides cabin air filtration and hygiene, each for up to four Kerbals throughout the vessel. Air filtration consumes 0.02 EC/s and hygiene consumes 0.06 EC/s, for a total of 0.08 EC/s with both services operating. Each service has an independent operating switch and standard maintenance cycle, with one repair kit per intervention. Its six crew seats and existing command, science and communication functions are retained.
    }
    es-es
    {
        #LOC_Koffee_Planetside_Lab_Description = La ciencia nunca ha sido tan fácil con este módulo de laboratorio de superficie. Ofrece dos puestos científicos para experimentos Koffee de StationBasic y conserva el procesamiento de datos, la conversión científica y la gestión de experiencia de la tripulación del laboratorio stock.
        #LOC_Koffee_Planetside_Greenhouse_Description = Este módulo hidropónico utiliza sus plantas para potenciar el filtrado del aire de cabina para hasta cuatro Kerbals en toda la nave. El filtrado consume 0,02 EC/s y sigue el ciclo habitual de mantenimiento de servicios, con un kit de reparación por intervención. Conserva sus dos plazas de tripulación y el acceso a KerbNet.
        #LOC_Koffee_Planetside_Command_Description = Este nodo de comando para bases también proporciona filtrado del aire de cabina e higiene, cada servicio para hasta cuatro Kerbals en toda la nave. El filtrado consume 0,02 EC/s y la higiene consume 0,06 EC/s, con un total de 0,08 EC/s cuando ambos servicios están funcionando. Cada servicio tiene su propio interruptor y ciclo habitual de mantenimiento, con un kit de reparación por intervención. Conserva sus seis plazas y las funciones existentes de comando, ciencia y comunicaciones.
    }
}
