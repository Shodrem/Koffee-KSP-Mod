// Explicit Koffee hardware only. No autonomous converter, stock or third-party consumer.
@PART[SHOExperimentManagerEMR01|SHOExperimentManagerEML125]:FINAL
{
    MODULE
    {
        name = ModuleKoffeePowerConsumer
        electricChargePerSecond = 0.01
    }
}

@PART[SHOExperimentDeviceED01|SHOSpaceCameraCAMX|SHOSolarRadiometerRSA|SHORadiationPressureRPA|SHOSpaceTelescopeSTS25]:FINAL
{
    MODULE
    {
        name = ModuleKoffeePowerConsumer
        electricChargePerSecond = 0.02
    }
}

@PART[SHOLaserMeasurerLMRX|SHOOpticalBenchBO01]:FINAL
{
    MODULE
    {
        name = ModuleKoffeePowerConsumer
        electricChargePerSecond = 0.05
    }
}

// Hidden configuration records also preserve the old fixed ED-01 hardware in
// existing craft/saves. Only an installed record doing real work is a consumer.
@PART[koffeeExperimentContainer_BatteryConservation|koffeeExperimentContainer_ExtendedCrewStudy|koffeeExperimentContainer_MysteryGooStudy|koffeeExperimentContainer_OpticalSystemStability|koffeeExperimentContainer_RadiationDosimetry|koffeeExperimentContainer_RadiationPressure|koffeeExperimentContainer_SolarRadiometry|koffeeExperimentContainer_SurfaceAltimetry|koffeeExperimentContainer_SurfaceObservation|koffeeExperimentContainer_SurfacePressureStudy|koffeeExperimentContainer_TelescopeObservation|koffeeExperimentContainer_TelescopeOccultation|koffeeExperimentContainer_ThermalEnvironmentStudy]:FINAL
{
    MODULE
    {
        name = ModuleKoffeePowerConsumer
        electricChargePerSecond = 0.02
    }
}

// BiGEn and MaPhyTec: one laboratory cost, shared by all work on that part.
@PART[SHOSpaceLabKF01|SHOAdvancedLab25Test]:FINAL
{
    MODULE
    {
        name = ModuleKoffeePowerConsumer
        electricChargePerSecond = 0
        laboratoryElectricChargePerSecond = 4
    }
}

// STS-25 keeps its 0.02 instrument tariff when serving another laboratory.
// Its own laboratory role replaces that tariff, rather than adding it twice.
@PART[SHOSpaceTelescopeSTS25]:FINAL
{
    @MODULE[ModuleKoffeePowerConsumer]
    {
        laboratoryElectricChargePerSecond = 4
    }
}
