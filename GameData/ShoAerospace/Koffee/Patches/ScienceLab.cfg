@PART[Large_Crewed_Lab]:HAS[!MODULE[ModuleKoffeeLab]]:AFTER[Squad]
{
    MODULE
    {
        name = ModuleKoffeeLab
        stationCapabilities = StationBasic
        requiredExperimentUpgrade = koffeeStockLabExperiments
        experimentExecutionEnabled = false
        UPGRADES
        {
            UPGRADE
            {
                name__ = koffeeStockLabExperiments
                description__ = #LOC_Koffee_StockLabUpgrade_Info
                experimentExecutionEnabled = true
            }
        }
    }
}
