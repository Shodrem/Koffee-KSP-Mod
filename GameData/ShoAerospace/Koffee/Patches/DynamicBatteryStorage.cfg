// Patch the existing settings node: DBS loads this exact database URL.
// Reporting only. Koffee remains the sole owner of its EC transactions.
@DYNAMICBATTERYSTORAGE:NEEDS[DynamicBatteryStorage]:AFTER[DynamicBatteryStorage]
{
    HANDLERCATEGORY
    {
        name = KoffeeResearch
        title = #Koffee_DBS_Category
        module = ModuleKoffeePowerConsumer
    }
    // The custom cabin light inherits stock ModuleLight resource handling.
    @HANDLERCATEGORY[Lights]
    {
        module = ModuleKoffeeCabinLights
    }
    PARTMODULEHANDLER
    {
        name = ModuleKoffeeCabinLights
        type = Power
        handlerModuleName = ModuleLightPowerHandler
        visible = true
        solarEfficiencyEffects = false
        producer = false
        consumer = true
        simulated = true
        continuous = true
    }
    PARTMODULEHANDLER
    {
        name = ModuleKoffeePowerConsumer
        type = Power
        handlerModuleName = GenericFieldDataHandler
        visible = true
        solarEfficiencyEffects = false
        producer = false
        consumer = true
        simulated = true
        continuous = true
        HANDLER_CONFIG
        {
            editorFieldName = dbsEditorDemand
            flightFieldName = dbsFlightDemand
            editorValueScalar = -1
            flightValueScalar = -1
        }
    }
}
