// Laboratories do not carry Koffee, even if a previous patch added a reserve.
@PART[*]:HAS[@MODULE[ModuleScienceLab]]:FOR[Koffee]
{
    !RESOURCE[Koffee],* {}
}

// BiGEn remains a laboratory without a cup reserve after its stock modules
// are removed. Keep the capacity of every other crewed part unchanged.
@PART[SHOSpaceLabKF01]:FOR[Koffee]
{
    !RESOURCE[Koffee],* {}
}

// Every crewed part without command or a laboratory carries ten cups per seat.
// Includes stock/mod habitats and passenger cabins.
// Replace existing Koffee nodes to enforce one consistent capacity, without duplicates.
@PART[*]:HAS[!MODULE[ModuleCommand],!MODULE[ModuleScienceLab],~name[SHOSpaceLabKF01],#CrewCapacity[>0]]:FOR[Koffee]
{
    !RESOURCE[Koffee],* {}
    RESOURCE
    {
        name = Koffee
        amount = #$../CrewCapacity$
        @amount *= 10
        maxAmount = #$amount$
    }
}
