// Integrated cup reserves: command parts and all laboratories carry no Koffee.
// Keep cleanup selectors exclusive when a part has several of these modules.
@PART[*]:HAS[@MODULE[ModuleCommand]]:FOR[Koffee]
{
    !RESOURCE[Koffee],* {}
}

@PART[*]:HAS[!MODULE[ModuleCommand],@MODULE[ModuleScienceLab]]:FOR[Koffee]
{
    !RESOURCE[Koffee],* {}
}

@PART[*]:HAS[!MODULE[ModuleCommand],!MODULE[ModuleScienceLab],@MODULE[ModuleKoffeeLab]]:FOR[Koffee]
{
    !RESOURCE[Koffee],* {}
}

// Other crewed parts carry ten cups per configured seat, including mod habitats.
// Replace all previous Koffee nodes so repeated application cannot duplicate cups.
// Uncrewed storage parts and optional B9 cargo subtypes keep their own capacities.
@PART[*]:HAS[!MODULE[ModuleCommand],!MODULE[ModuleScienceLab],!MODULE[ModuleKoffeeLab],#CrewCapacity[>0]]:FOR[Koffee]
{
    !RESOURCE[Koffee],* {}
    RESOURCE
    {
        name = Koffee
        amount = #$../CrewCapacity$
        @amount *= 10
        maxAmount = #$amount$
    }
}
