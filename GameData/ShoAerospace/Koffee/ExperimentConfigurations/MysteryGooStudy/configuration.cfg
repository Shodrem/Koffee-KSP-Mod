PART
{
    name = koffeeExperimentContainer_MysteryGooStudy
    module = Part
    author = ShoAerospace

    MODEL
    {
        model = ShoAerospace/Koffee/Parts/Experiments_Device_ED-01/Experiment_Device_ED01
        // Keep exported textures: stock ReplaceTextures cannot handle null maps in this model.
        scale = 1, 1, 1
    }
    scale = 1
    rescaleFactor = 0.75

    // Unscaled attach_Back position; stock rescaleFactor also scales this node.
    // Preserve the current shared ED-01 surface normal.
    node_attach = 0, 0, 0.173999995, 0, 0, -1, 0
    // Rear stack attachment shares the current ED-01 coordinates.
    node_stack_back = 0, 0, 0.173999995, 0, 0, 1, 0
    // Lower node uses unscaled MU coordinates; rescaleFactor applies once.
    node_stack_bottom = 0, -0.396150000, 0, 0, -1, 0, 0
    attachRules = 1,1,1,1,0

    TechRequired = koffeeTechnologyMaterials1
    entryCost = 4800
    cost = 1200
    category = Science
    subcategory = 0
    title = #LOC_Koffee_MysteryGooStudy_PartTitle
    manufacturer = #LOC_Koffee_Manufacturer
    description = #LOC_Koffee_MysteryGooStudy_Description
    tags = #LOC_Koffee_MysteryGooStudy_Tags
    bulkheadProfiles = srf

    mass = 0.15
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 1
    crashTolerance = 12
    maxTemp = 1200

    MODULE
    {
        name = ModuleKoffeeExperiment
        experimentID = mysteryGooStudy
        surfaceEnabled = false
        UPGRADES
        {
            UPGRADE
            {
                name__ = koffeeGooSurface
                description__ = #LOC_Koffee_MysteryGooStudy_SurfaceUpgrade_Info
                surfaceEnabled = true
            }
        }
    }

    MODULE
    {
        name = ModuleCargoPart
        // 75% renderer envelope: 90.088 L, rounded up.
        packedVolume = 91
        stackableQuantity = 1
    }

    // One fixed label, addressed by material; no alternate colors or mounting formats.
    MODULE
    {
        name = ModulePartVariants
        // Fixed visual setup only; hide its fields from the PAW.
        isEnabled = false
        baseVariant = Materials
        useMultipleDragCubes = false
        VARIANT
        {
            name = Materials
            displayName = Materials
            TEXTURE
            {
                materialName = Category_Mat
                mainTextureURL = ShoAerospace/Koffee/Parts/Experiments_Device_ED-01/Label_Materials
            }
        }
    }
}
