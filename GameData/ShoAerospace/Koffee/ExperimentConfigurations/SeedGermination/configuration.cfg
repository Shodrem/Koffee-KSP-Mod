PART
{
    name = koffeeExperimentContainer_SeedGermination
    module = Part
    author = ShoAerospace

    MODEL
    {
        model = ShoAerospace/Koffee/Parts/Experiment_Container_62/Experiment_Container_625
        texture = Label_Name, ShoAerospace/Koffee/Parts/Experiment_Container_62/Label_Biology
        texture = Experiment_Container_Base_color, ShoAerospace/Koffee/Parts/Experiment_Container_62/Experiment_Container_Light_green_Base_color
        scale = 1, 1, 1
    }
    scale = 1
    rescaleFactor = 1

    // Docking uses attach_Docking; Stack overrides bottom at the body base.
    // attach_Backside is intentionally unused.
    NODE
    {
        name = top
        transform = Attach_01
        size = 0
        method = FIXED_JOINT
    }
    NODE
    {
        name = bottom
        transform = attach_Docking
        size = 0
        method = FIXED_JOINT
    }
    // Surface mounting point measured from Attach_03 in the exported model.
    // Normal is +Z as specified for the lateral surface anchor used by Bare.
    node_attach = -0.400000006, 0, 0, 0, 0, 1, 0
    attachRules = 1,0,1,1,0

    TechRequired = koffeeBioGeoEnvironment2
    entryCost = 5400
    cost = 1350
    category = Science
    subcategory = 0
    title = #LOC_Koffee_SeedGermination_PartTitle
    manufacturer = #LOC_Koffee_Manufacturer
    description = #LOC_Koffee_SeedGermination_Description
    tags = #LOC_Koffee_SeedGermination_Tags

    mass = 0.35
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 2
    crashTolerance = 12
    maxTemp = 1200
    bulkheadProfiles = size0

    MODULE
    {
        name = ModuleKoffeeExperiment
        experimentID = seedGermination
    }

    MODULE
    {
        name = ModuleCargoPart
        // Preserve inventory capacity; V2 largest envelope with Datacable is ~307.244 L.
        packedVolume = 385
        stackableQuantity = 1
    }

    // Docking anchor exported inside experiment_docker; same compatibility as EB-25 / ED-06.
    MODULE
    {
        name = ModuleDockingNode
        nodeTransformName = attach_Docking
        controlTransformName = attach_Docking
        referenceAttachNode = bottom
        nodeType = size0
        gendered = false
        genderFemale = false
        stagingEnabled = false
        crossfeed = false
        canRotate = false
        acquireRange = 0.15
        acquireForce = 0.25
        acquireTorque = 0.25
        captureRange = 0.025
        minDistanceToReEngage = 0.2
        undockEjectionForce = 0.1
    }
    MODULE
    {
        name = ModulePartVariants
        baseVariant = Docking
        useMultipleDragCubes = true

        VARIANT
        {
            name = Docking
            displayName = #LOC_Koffee_ExperimentDock62_Variant_Docking
            attachRules = 1,0,1,1,0
            sizeGroup = Docking
            primaryColor = #ffffff
            secondaryColor = #888888
            GAMEOBJECTS
            {
                experiment_docker = true
                Datacable = false
            }
            NODES
            {
                node_stack_bottom = 0, 0, -0.32, 0, 0, -1, 0
                node_attach = -0.400000006, 0, 0, 0, 0, 1, 0
            }
        }
        VARIANT
        {
            name = Bare
            displayName = #LOC_Koffee_ExperimentDock62_Variant_Bare
            attachRules = 0,1,1,1,0
            sizeGroup = Surface
            primaryColor = #ffffff
            secondaryColor = #dddddd
            GAMEOBJECTS
            {
                experiment_docker = false
                Datacable = true
            }
            NODES
            {
                node_stack_bottom = 0, 0, -0.32, 0, 0, -1, 0
                node_attach = -0.400000006, 0, 0, 0, 0, 1, 0
            }
        }
        VARIANT
        {
            name = Stack
            displayName = #LOC_Koffee_ExperimentDock62_Variant_Stack
            attachRules = 1,1,1,1,0
            sizeGroup = Stack
            primaryColor = #ffffff
            secondaryColor = #bbbbbb
            GAMEOBJECTS
            {
                experiment_docker = false
                Datacable = false
            }
            NODES
            {
                node_stack_bottom = 0, 0, -0.25, 0, 0, -1, 0
                // Surface mounting at the bottom face, not the lateral Attach_03.
                node_attach = 0, 0, -0.25, 0, 0, -1, 0
            }
        }
    }
    MODULE
    {
        name = ModuleKoffeeDockingVisibility
        visibilityTransform = experiment_docker
        nodeType = size0
        controlledAttachNode = bottom
        disableAttachNodeTransform = Datacable
    }
}
