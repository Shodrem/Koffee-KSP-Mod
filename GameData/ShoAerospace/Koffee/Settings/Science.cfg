// Koffee - Scientist productivity
//
// This is the additional productivity bonus received by each scientist while
// that individual scientist is Kaffeinated. It is applied on top of the normal
// stock contribution from the scientist's experience level:
//
//     stock contribution = 1 + stock scientistBonus * experience level
//     final contribution = stock contribution * (1 + scientistKoffeeBonus)
//
// Example: a stock contribution of 1.50 with a value of 0.10 becomes 1.65.
// A value of 0.10 means +10%. Changes require restarting KSP.
KOFFEE_SCIENCE_SETTINGS
{
    scientistKoffeeBonus = 0.10
}
