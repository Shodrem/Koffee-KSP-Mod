// Stock engineering targets supported by Koffee's compiled converter adapters.
// ModuleManager may add compatible targets. The DLL accepts only the two module
// families shown here and never patches arbitrary types from configuration.
KOFFEE_ENGINEERING_TARGET
{
    name = stockMiniDrill
    part = MiniDrill
    module = ModuleResourceHarvester
    experienceEffect = DrillSkill
    enabled = true
}

KOFFEE_ENGINEERING_TARGET
{
    name = stockRadialDrill
    part = RadialDrill
    module = ModuleResourceHarvester
    experienceEffect = DrillSkill
    enabled = true
}

KOFFEE_ENGINEERING_TARGET
{
    name = stockIsru
    part = ISRU
    module = ModuleResourceConverter
    experienceEffect = ConverterSkill
    enabled = true
}

KOFFEE_ENGINEERING_TARGET
{
    name = stockMiniIsru
    part = MiniISRU
    module = ModuleResourceConverter
    experienceEffect = ConverterSkill
    enabled = true
}
