// Bonus de productividad para ingenieros Kaffeinated.
//
// engineerSelection admite dos valores:
//   BestEngineer   = usa siempre al ingeniero relevante de mayor nivel. Si no está
//                    Kaffeinated, intenta consumir una Koffee para él aunque otro
//                    ingeniero de menor nivel ya esté Kaffeinated.
//   AnyKaffeinated = aprovecha al ingeniero Kaffeinated de mayor nivel. Solo consume
//                    una Koffee cuando no haya ningún ingeniero relevante activo.
//
// Cada bonusLevel es una fracción adicional sobre toda la eficiencia stock.
// Por ejemplo, 0.20 significa +20 %. Los cambios requieren recargar el juego.
KOFFEE_ENGINEERING_SETTINGS
{
    engineerSelection = BestEngineer

    bonusLevel0 = 0.05
    bonusLevel1 = 0.10
    bonusLevel2 = 0.15
    bonusLevel3 = 0.20
    bonusLevel4 = 0.25
    bonusLevel5 = 0.30
}
