        #LOC_Koffee_SurfacePressureStudy_PartTitle = Estudio prolongado de presión en superficie
        #LOC_Koffee_SurfacePressureStudy_Title = Estudio prolongado de presión en superficie
        #LOC_Koffee_SurfacePressureStudy_Description = Un dispositivo de investigación ED-01 de Entorno para estudiar la presión local durante una estancia prolongada, aterrizado en cualquier cuerpo celeste, incluidos los mundos sin atmósfera. Requiere un barómetro PresMat instalado en la misma nave y produce datos completamente transmisibles, con ciencia por cada bioma en superficie. Con afinidad 5 y un científico de nivel 1, el estudio requiere aproximadamente tres días de Kerbin de trabajo efectivo. El informe incluye la lectura inicial de presión estática en kPa. Científicos expertos en el campo de Entorno realizarán este experimento en menos tiempo.
        #LOC_Koffee_SurfacePressureStudy_Tags = experimento investigación ciencia estación dispositivo entorno presión atmósfera barómetro superficie aterrizado vacío ED-01 radial
        #LOC_Koffee_SurfacePressureStudy_Result_Default = La investigación prolongada proporciona una referencia de presión del lugar de aterrizaje. El informe conserva la lectura inicial del barómetro para comparar destinos y planificar futuras operaciones en superficie. El científico ha solicitado un indicador aparte para la cafetera.
        #LOC_Koffee_SurfacePressureStudy_Result_Landed = El estudio en superficie utiliza la presión registrada como referencia para planificar equipos y estancias más largas en este lugar. Una lectura de cero también resulta útil al evaluar operaciones en vacío. La taza de café continúa fuera de las competencias del barómetro.
