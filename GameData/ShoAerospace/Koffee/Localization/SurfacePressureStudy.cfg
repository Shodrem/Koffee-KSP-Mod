        #LOC_Koffee_SurfacePressureStudy_Description = An ED-01 Environment research device for a long study of local pressure while landed on any celestial body, including airless worlds. Requires a PresMat barometer installed on the same vessel and produces fully transmissible data, with science for each surface biome. With affinity 5 and a level 1 scientist, the study takes approximately three Kerbin days of effective work. The report includes the initial static pressure reading in kPa. Scientists with expertise in the field of Environment will complete this experiment in less time.
        #LOC_Koffee_SurfacePressureStudy_Tags = experiment research science station device environment pressure atmosphere barometer surface landed vacuum ED-01 radial
        #LOC_Koffee_SurfacePressureStudy_Result_Default = The long investigation provides a pressure reference for the landing site. The report retains the initial barometer reading to support comparisons with other destinations and planning of future surface operations. The scientist has requested a separate gauge for the coffee machine.
        #LOC_Koffee_SurfacePressureStudy_Result_Landed = The surface study uses the recorded pressure as a reference for planning equipment and longer stays at this site. A reading of zero is also useful when assessing operations in vacuum. The coffee cup remains firmly outside the barometer's remit.
