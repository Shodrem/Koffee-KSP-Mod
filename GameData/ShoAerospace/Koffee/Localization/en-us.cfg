        #LOC_Koffee_ContainerIntegrity_Tags = experiment research science station container integrity
        #LOC_Koffee_ContainerIntegrity_Result_Landed = The container remains in perfect condition. The wind has deposited some dust on its surface, but no effect on the structure or the test load can be observed.
        #LOC_Koffee_ContainerIntegrity_Result_Splashed = The container remains in perfect condition. The waves have soaked its entire surface and left traces of salt, although a much longer exposure would be needed before corrosion became a concern.
        #LOC_Koffee_ContainerIntegrity_Result_SpaceLow = The container remains in perfect condition. As expected, exposure to vacuum does not appear to affect the structure or the protection of the test load.
        #LOC_Koffee_ContainerIntegrity_Result_SpaceHigh = The container remains in perfect condition. Prolonged exposure to the harsher radiation environment may cause slight degradation of the exterior paint, but the structure and the protection of the test load remain unaffected.
