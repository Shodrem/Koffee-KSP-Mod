        #LOC_Koffee_ExtendedCrewStudy_PartTitle = Extended Crew Study
        #LOC_Koffee_ExtendedCrewStudy_Title = Extended Crew Study
        #LOC_Koffee_ExtendedCrewStudy_Description = An ED-01 Biology research device for recording how crew concentration, rest, coordination, and adaptation develop during an extended stay. Includes forms, repeatable tasks, and a pencil secured with Velcro. Scientists with expertise in the field of Biology will complete this experiment in less time.
        #LOC_Koffee_ExtendedCrewStudy_Tags = experiment research science station device biology crew report extended study ED-01 radial
        #LOC_Koffee_ExtendedCrewStudy_Result_Default = After several shifts, the crew needs fewer reminders to coordinate tasks and can find belongings without chasing them around the cabin. Rest and concentration logs suggest that a shared routine helps adaptation; the pencil still demands freedom.
        #LOC_Koffee_ExtendedCrewStudy_Result_KerbinInSpaceLow = Frequent sunrises initially distract the crew and inspire a different bedtime proposal from every kerbal. Once shifts are agreed, repeated tasks need fewer corrections and coordination improves. Looking out the window is classified as a break, although the scenery deserves a report of its own.
        #LOC_Koffee_ExtendedCrewStudy_Result_KerbinInSpaceHigh = All of Kerbin fits in the window, but it no longer sets the pace of every task. Over the study, rest schedules become more regular and concentration is steadier during work sessions. The crew learns to give a warning before releasing a folder: another useful form of orbital coordination.
        #LOC_Koffee_ExtendedCrewStudy_Result_MunInSpaceLow = The first passes over the craters cause interruptions and several conversations at once. After a few shifts, the crew sets aside observation time and completes tasks with fewer omissions. The logs show better adaptation to the routine, without settling who named a crater after a sandwich.
        #LOC_Koffee_ExtendedCrewStudy_Result_MunInSpaceHigh = The Mun changes position slowly and stops being a useful improvised clock. The crew arranges rest in shifts and uses shared checklists to coordinate work. Later sessions show fewer concentration errors; counting craters to fall asleep remains an impractical idea.
        #LOC_Koffee_ExtendedCrewStudy_Result_MinmusInSpaceLow = The terrain of Minmus initially inspires equal enthusiasm for exploration and arguments about desserts. As the shifts pass, agreed breaks reduce interruptions and the crew coordinates observation tasks more effectively. The report records adaptation to the stay, but no evidence that the surface is edible.
        #LOC_Koffee_ExtendedCrewStudy_Result_MinmusInSpaceHigh = Minmus looks like a small green reference point in a window full of darkness. During the stay, shift handovers and rest schedules help sustain concentration and a shared routine. Coordination improves once every tool has a fixed place; the space reserved for ice cream remains empty.

        #LOC_Koffee_ContainerIntegrity_PartTitle = Container Integrity Test
        #LOC_Koffee_ContainerIntegrity_Title = Container Integrity Test
        #LOC_Koffee_ContainerIntegrity_Description = A 0.625 m instrumented container designed to verify that its structure, seals, and protection system preserve an internal test load throughout a mission. Our scientists would appreciate recovering the container, not just the data, so they can study it. Recovering it on Kerbin with its result grants an additional 20% of the recovered science. Scientists with expertise in the field of Technology will complete this experiment in less time.
