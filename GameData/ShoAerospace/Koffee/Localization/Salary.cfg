Localization
{
    en-us
    {
        #Koffee_Salary_Enable = Mission salaries
        #Koffee_Salary_EnableHelp = Enabled in Career. Pay crew on recovery on Kerbin; death forfeits salary and costs 5% of current reputation. Disabling pauses accrual and removes these costs; recovering while disabled clears pending pay.
        #Koffee_Salary_Base = Base salary (funds/day)
        #Koffee_Salary_PerLevel = Salary increase per level (funds/day)
        #Koffee_Salary_RateHelp = Non-negative number, up to 1000000. A day is 6 hours, including fractions. Base + increase × departure level is fixed for each mission. Changes apply to new missions.
        #Koffee_Salary_Accrued = Accumulated salary: <<1>> funds (<<2>>/day; departure level <<3>>)
        #Koffee_Salary_RecoveryCrew = Mission salary: <<1>> days × <<2>> funds/day = <<3>> funds
        #Koffee_Salary_RecoveryActual = Effective salary charge: <<1>> funds
        #Koffee_Salary_RecoveryTotal = Total crew salaries: <<1>> funds
        #Koffee_Salary_RecoveryFunds = Recovered: <<1>> funds; salaries: <<2>> funds; net: <<3>> funds
    }
    es-es
    {
        #Koffee_Salary_Enable = Sueldos de misión
        #Koffee_Salary_EnableHelp = Activo en Carrera. Se paga al recuperar en Kerbin; morir anula el sueldo y cuesta un 5% de la reputación actual. Desactivarlo pausa la acumulación y elimina estos costes; recuperar mientras está desactivado cancela el sueldo pendiente.
        #Koffee_Salary_Base = Sueldo base (fondos/día)
        #Koffee_Salary_PerLevel = Aumento por nivel (fondos/día)
        #Koffee_Salary_RateHelp = Número no negativo, hasta 1000000. Un día son 6 horas, incluidas sus fracciones. Base + aumento × nivel al salir queda fijado para cada misión. Los cambios se aplican a nuevas misiones.
        #Koffee_Salary_Accrued = Sueldo acumulado: <<1>> fondos (<<2>>/día; nivel al salir <<3>>)
        #Koffee_Salary_RecoveryCrew = Sueldo de misión: <<1>> días × <<2>> fondos/día = <<3>> fondos
        #Koffee_Salary_RecoveryActual = Descuento efectivo de sueldo: <<1>> fondos
        #Koffee_Salary_RecoveryTotal = Total de sueldos de la tripulación: <<1>> fondos
        #Koffee_Salary_RecoveryFunds = Recuperado: <<1>> fondos; sueldos: <<2>> fondos; neto: <<3>> fondos
    }
}
