        #LOC_Koffee_BatteryConservation_PartTitle = Battery Conservation
        #LOC_Koffee_BatteryConservation_Title = Battery Conservation
        #LOC_Koffee_BatteryConservation_Description = This ED-01 configuration allows a battery conservation study using a Z-100 rechargeable battery installed on the same vessel. The test compares its behaviour during a stay in orbit or on the surface with reference procedures prepared on Kerbin. The battery remains available to power the vessel’s systems.\n\nThe study produces a fully transmissible report and does not require recovering the battery. The protocol forbids borrowing batteries from the hatch remote, even if they look the same size.\n\nScientists specializing in Technology will complete this experiment in less time.
        #LOC_Koffee_BatteryConservation_Tags = experiment research science station technology battery conservation z100 z-100 electric charge ed01 orbit surface
        #LOC_Koffee_BatteryConservation_Result_Default = The Z-100 conservation study has been completed and the report prepared for transmission. The battery remains installed and available for normal vessel operations.\n\nThe engineering department has asked to keep the receipt as well. Apparently, “tested in space” does not automatically extend the warranty.
        #LOC_Koffee_BatteryConservation_Result_InSpaceLow = The Z-100 conservation test has finished during the stay in low orbit. The report brings together the procedure notes for comparison with the reference tests on Kerbin.\n\nThe crew proposed checking how long the battery would last by switching on every light in the station. Engineering replied that this would be a different experiment, probably a much shorter one.
        #LOC_Koffee_BatteryConservation_Result_InSpaceHigh = The battery conservation study has been completed during the stay in high orbit. The report is ready for transmission and the Z-100 remains part of the vessel’s electrical system.\n\nThe technician wrote “long life” on the folder. The scientist added “of the study” before anyone could copy it into the manufacturer’s catalogue.
        #LOC_Koffee_BatteryConservation_Result_SrfLanded = The Z-100 conservation study has concluded in the surface laboratory. The report documents the procedure carried out with the battery installed on the vessel, without requiring its return to Kerbin.\n\nA proposal to store the spare battery under a rock has been rejected. It solved the storage problem, but made maintenance considerably more complicated.
    }
    es-es
    {
        #LOC_Koffee_BatteryConservation_PartTitle = Conservación de baterías
        #LOC_Koffee_BatteryConservation_Title = Conservación de baterías
        #LOC_Koffee_BatteryConservation_Description = Esta configuración del ED-01 permite realizar un estudio de conservación de baterías utilizando una batería recargable Z-100 instalada en la misma nave. El ensayo compara su comportamiento durante una estancia en órbita o en superficie con los procedimientos de referencia preparados en Kerbin. La batería continúa disponible para alimentar los sistemas de la nave.\n\nEl estudio produce un informe completamente transmisible y no requiere recuperar la batería. El protocolo prohíbe tomar prestadas las pilas del mando de la escotilla, incluso si parecen del mismo tamaño.\n\nCientíficos expertos en el campo de Tecnología realizarán este experimento en menos tiempo.
        #LOC_Koffee_BatteryConservation_Tags = experimento investigación ciencia estación tecnología batería conservación z100 z-100 eléctrica carga ed01 órbita superficie
        #LOC_Koffee_BatteryConservation_Result_Default = Se ha completado el estudio de conservación de la Z-100 y se ha preparado el informe para su transmisión. La batería permanece instalada y disponible para el servicio habitual de la nave.\n\nEl departamento de ingeniería ha pedido conservar también el recibo. Al parecer, «probada en el espacio» no amplía automáticamente la garantía.
        #LOC_Koffee_BatteryConservation_Result_InSpaceLow = El ensayo de conservación de la Z-100 ha finalizado durante la estancia en órbita baja. El informe reúne las notas del procedimiento para compararlas con los ensayos de referencia de Kerbin.\n\nLa tripulación propuso comprobar cuánto duraba la batería encendiendo todas las luces de la estación. Ingeniería respondió que aquello sería otro experimento, probablemente bastante más corto.
        #LOC_Koffee_BatteryConservation_Result_InSpaceHigh = Se ha completado el estudio de conservación de la batería durante la estancia en órbita alta. El informe queda preparado para su transmisión y la Z-100 sigue formando parte del sistema eléctrico de la nave.\n\nEl técnico ha escrito «larga duración» en la carpeta. El científico ha añadido «del estudio» antes de que alguien lo copiara en el catálogo del fabricante.
        #LOC_Koffee_BatteryConservation_Result_SrfLanded = El estudio de conservación de la Z-100 ha concluido en el laboratorio de superficie. El informe documenta el procedimiento realizado con la batería instalada en la nave, sin necesidad de devolverla a Kerbin.\n\nSe ha descartado guardar la batería de repuesto bajo una roca. La propuesta resolvía el almacenamiento, pero complicaba considerablemente el mantenimiento.
    }
}
