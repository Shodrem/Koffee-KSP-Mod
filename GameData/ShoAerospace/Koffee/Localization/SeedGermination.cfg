        #LOC_Koffee_SeedGermination_Title = Seed Germination Study
        #LOC_Koffee_SeedGermination_Description = A 0.625 m Biology container with seeds, a moist growth medium, and internal lighting for studying germination during an orbital stay. The seedlings remain inside the sealed chamber; no separate cultivation module is required. Recover the samples to study them in detail: transmitting the report provides only part of the science. Scientists with expertise in the field of Biology will complete this experiment in less time.
        #LOC_Koffee_SeedGermination_Tags = experiment research science station container biology seeds germination growth orbital study
        #LOC_Koffee_SeedGermination_Result_Default = The seeds have germinated in the moist medium. The report describes the emergence of roots and shoots inside the chamber, while the preserved seedlings await a detailed examination after recovery. One seedling has been nominated as the mission's smallest crew member.
        #LOC_Koffee_SeedGermination_Result_SpaceLow = The seedlings develop inside the illuminated chamber without contact with the surface below. The scientist records how roots and shoots spread through the growth medium and preserves the samples for examination after recovery. The instruction to keep the pot upright has been quietly crossed out.
        #LOC_Koffee_SeedGermination_Result_SpaceHigh = The seeds complete their germination trial in the sealed chamber, far from the surface of the orbited body. The report describes their development under the container's internal conditions; the samples will allow a closer examination after recovery. Watering with a floating can has been ruled out.
    }
    es-es
    {
        #LOC_Koffee_SeedGermination_PartTitle = Estudio de germinación de semillas
        #LOC_Koffee_SeedGermination_Title = Estudio de germinación de semillas
        #LOC_Koffee_SeedGermination_Description = Un contenedor de Biología de 0,625 m con semillas, un medio de cultivo húmedo e iluminación interna para estudiar la germinación durante una estancia orbital. Las plántulas permanecen en la cámara sellada; no requiere un módulo de cultivo independiente. Recupera las muestras para estudiarlas en detalle: transmitir el informe proporciona solo parte de la ciencia. Científicos expertos en el campo de Biología realizarán este experimento en menos tiempo.
        #LOC_Koffee_SeedGermination_Tags = experimento investigación ciencia estación contenedor biología semillas germinación crecimiento estudio orbital biology seeds germination
        #LOC_Koffee_SeedGermination_Result_Default = Las semillas han germinado en el medio húmedo. El informe describe la aparición de raíces y brotes dentro de la cámara, mientras las plántulas conservadas esperan un examen detallado tras su recuperación. Una de ellas ha sido propuesta como el tripulante más pequeño de la misión.
        #LOC_Koffee_SeedGermination_Result_SpaceLow = Las plántulas se desarrollan en la cámara iluminada sin contacto con la superficie que queda debajo. El científico registra cómo las raíces y los brotes se extienden por el medio de cultivo y conserva las muestras para examinarlas tras su recuperación. La instrucción de mantener la maceta derecha ha sido tachada discretamente.
        #LOC_Koffee_SeedGermination_Result_SpaceHigh = Las semillas completan el ensayo de germinación en la cámara sellada, lejos de la superficie del cuerpo alrededor del que orbitan. El informe describe su desarrollo bajo las condiciones internas del contenedor; las muestras permitirán un examen más detenido tras su recuperación. Se descarta regarlas con una regadera flotante.
    }
