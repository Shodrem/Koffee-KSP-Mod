Localization
{
    en-us
    {
        #Koffee_EditorKomfort_Value = Predicted Komfort: <<1>>
        #Koffee_EditorKomfort_Crew = Assigned crew: <<1>>
        #Koffee_EditorKomfort_NoShip = Build or load a vessel to see its predicted Komfort.
        #Koffee_EditorKomfort_AssumptionHome = Design estimate with enabled services powered. The installed Direct/Relay antenna only adds communication Komfort if it connects to Kerbin in flight, directly or through relays. An installed antenna does not guarantee a connection.
        #Koffee_EditorKomfort_AssumptionNoHome = Design estimate with enabled services powered and no home connection (CommNet disabled). Actual flight Komfort depends on operation.
        #Koffee_EditorKomfort_AssumptionNoAntenna = Design estimate with enabled services powered. Without an installed Direct/Relay antenna, no connection to Kerbin is assumed. Internal capsule and probe antennas do not count for this preview. In flight, internal antennas can contribute communication Komfort in Kerbin orbit while they maintain a real connection to Kerbin. After launch, the Komfort reserve gradually adjusts to the maximum allowed by actual flight conditions.
    }
    es-es
    {
        #Koffee_EditorKomfort_Value = Komfort previsto: <<1>>
        #Koffee_EditorKomfort_Crew = Tripulación asignada: <<1>>
        #Koffee_EditorKomfort_NoShip = Construye o carga una nave para consultar su Komfort previsto.
        #Koffee_EditorKomfort_AssumptionHome = Estimación de diseño con los servicios encendidos alimentados. La antena Direct/Relay instalada solo aporta Komfort de comunicación si conecta con Kerbin en vuelo, directamente o mediante relés. Tener una antena no garantiza la conexión.
        #Koffee_EditorKomfort_AssumptionNoHome = Estimación de diseño con los servicios encendidos alimentados y sin conexión al hogar (CommNet desactivado). El Komfort real en vuelo depende de su operación.
        #Koffee_EditorKomfort_AssumptionNoAntenna = Estimación de diseño con los servicios encendidos alimentados. Sin una antena Direct/Relay instalada no se presupone conexión con Kerbin. Las antenas internas de cápsulas y sondas no cuentan para esta previsión. En vuelo, las antenas internas sí pueden aportar Komfort de comunicación en órbita de Kerbin mientras mantengan una conexión real con Kerbin. Tras el lanzamiento, la reserva de Komfort se ajusta poco a poco al máximo que permitan las condiciones reales de vuelo.
    }
}
