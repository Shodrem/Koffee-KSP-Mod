        #LOC_Koffee_MineralCrystalGrowth_Description = A 0.625 m Geology container with a prepared mineral solution and an internal growth chamber for studying crystal formation in orbit. The sample comes from the container, not from the surface of the orbited body, and requires no separate crystallization chamber. Recover the crystals to examine their structure: transmitting the report provides only part of the science. Scientists with expertise in the field of Geology will complete this experiment in less time.
        #LOC_Koffee_MineralCrystalGrowth_Tags = experiment research science station container geology mineral crystals crystallization growth orbital study
        #LOC_Koffee_MineralCrystalGrowth_Result_Default = Crystals have formed from the prepared mineral solution. The scientist describes their faces and growth patterns and preserves the sample for a detailed structural examination after recovery. The best specimen is labelled science, not jewellery.
        #LOC_Koffee_MineralCrystalGrowth_Result_SpaceLow = The prepared solution produces mineral crystals during the orbital trial. The report describes the arrangement of their faces and the interaction between neighbouring crystals; the preserved sample will allow a closer examination on return. These crystals reveal the behaviour of the solution, not the composition of the surface below.
        #LOC_Koffee_MineralCrystalGrowth_Result_SpaceHigh = The mineral solution completes its growth trial far from the surface of the orbited body. The scientist documents the crystals formed inside the chamber and preserves them for structural examination after recovery. The sample remains a product of the prepared solution, despite a suggestion to market it as a souvenir from the destination.
