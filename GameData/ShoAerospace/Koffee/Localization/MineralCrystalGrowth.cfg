        #LOC_Koffee_MineralCrystalGrowth_Title = Estudio de formación de cristales minerales
        #LOC_Koffee_MineralCrystalGrowth_Description = Un contenedor de Geología de 0,625 m con una disolución mineral preparada y una cámara interna para estudiar la formación de cristales en órbita. La muestra procede del contenedor, no de la superficie del cuerpo alrededor del que orbita, y no requiere una cámara de cristalización independiente. Recupera los cristales para examinar su estructura: transmitir el informe proporciona solo parte de la ciencia. Científicos expertos en el campo de Geología realizarán este experimento en menos tiempo.
        #LOC_Koffee_MineralCrystalGrowth_Tags = experimento investigación ciencia estación contenedor geología minerales cristales cristalización crecimiento estudio orbital geology crystals
        #LOC_Koffee_MineralCrystalGrowth_Result_Default = Se han formado cristales a partir de la disolución mineral preparada. El científico describe sus caras y patrones de crecimiento y conserva la muestra para examinar su estructura en detalle tras la recuperación. El mejor ejemplar lleva una etiqueta que dice ciencia, no bisutería.
        #LOC_Koffee_MineralCrystalGrowth_Result_SpaceLow = La disolución preparada produce cristales minerales durante el ensayo orbital. El informe describe la disposición de sus caras y la interacción entre cristales vecinos; la muestra conservada permitirá un examen más detenido al regresar. Estos cristales muestran el comportamiento de la disolución, no la composición de la superficie que queda debajo.
        #LOC_Koffee_MineralCrystalGrowth_Result_SpaceHigh = La disolución mineral completa el ensayo de crecimiento lejos de la superficie del cuerpo alrededor del que orbita. El científico documenta los cristales formados dentro de la cámara y los conserva para examinar su estructura tras la recuperación. La muestra sigue procediendo de la disolución preparada, pese a la propuesta de venderla como recuerdo del destino.
