        #LOC_Koffee_AlgaeCultivation_PartTitle = Estudio de cultivo de algas
        #LOC_Koffee_AlgaeCultivation_Title = Estudio de cultivo de algas
        #LOC_Koffee_AlgaeCultivation_Description = Un contenedor de Biología de 0,625 m con un cultivo de algas preparado, medio nutritivo e iluminación interna. Estudia su cultivo durante estancias en órbita baja y alta de cualquier cuerpo celeste, con el objetivo de desarrollar sistemas de cultivo sostenibles para futuras estaciones espaciales y bases en superficie. Una mejora de adaptación a superficie permite realizar el mismo estudio con el contenedor aterrizado o amerizado. Conserva el cultivo para examinarlo en detalle tras su recuperación. Científicos expertos en el campo de Biología realizarán este experimento en menos tiempo.
        #LOC_Koffee_AlgaeCultivation_Tags = experimento investigación ciencia estación contenedor biología algas cultivo crecimiento órbita superficie mejora biology algae
        #LOC_Koffee_AlgaeCultivation_Result_Default = El ensayo de cultivo ha terminado dentro de la cámara iluminada del contenedor. El científico documenta el aspecto y la distribución de las algas y conserva el cultivo para examinarlo tras su recuperación. El informe identifica cuestiones que deben resolverse antes de convertir un cultivo experimental en un cultivo fiable para abastecimiento.
        #LOC_Koffee_AlgaeCultivation_Result_SpaceLow = El cultivo de algas completa su ensayo en órbita baja, bajo las condiciones internas controladas de la cámara. El científico describe cómo se distribuye el cultivo en el medio nutritivo y lo conserva para examinarlo con más detalle. Las observaciones orientarán futuros ensayos de cultivo orbital; llamar granja al contenedor se considera prematuro.
        #LOC_Koffee_AlgaeCultivation_Result_SpaceHigh = Lejos de la superficie que queda debajo, la cámara iluminada completa su ensayo de cultivo de algas. El informe documenta el aspecto del cultivo y los procedimientos de manipulación empleados durante el estudio. El cultivo conservado ayudará a mejorar el diseño de sistemas de cultivo para largas estancias espaciales. La tripulación ha rechazado amablemente la sesión de degustación propuesta.
        #LOC_Koffee_AlgaeCultivation_Result_Landed = El contenedor adaptado a superficie completa un ensayo de cultivo en el lugar de aterrizaje. Las algas permanecen en su medio preparado y en la cámara sellada, independientes del suelo y la atmósfera exteriores. El científico documenta el cultivo para compararlo con los ensayos orbitales y orientar futuros sistemas de cultivo en bases. La etiqueta sigue diciendo experimento, no ensalada.
        #LOC_Koffee_AlgaeCultivation_Result_Splashed = La cámara adaptada a superficie completa su ensayo con la nave a flote. Las algas permanecen dentro del contenedor con su medio nutritivo preparado; ningún líquido exterior entra en el cultivo. El científico documenta el ensayo y conserva el cultivo para examinarlo. La sugerencia de abrir la tapa para regarlo se rechaza con firmeza.
        #LOC_Koffee_AlgaeCultivation_SurfaceUpgrade_Title = Cultivo de algas en superficie
        #LOC_Koffee_AlgaeCultivation_SurfaceUpgrade_Info = Habilita el Estudio de cultivo de algas con la nave aterrizada o amerizada.
        #LOC_Koffee_AlgaeCultivation_SurfaceUpgrade_Description = Adapta el contenedor del experimento de algas para realizar estudios de cultivo en instalaciones de superficie. Conserva su cámara de cultivo sellada y el funcionamiento orbital.
