        #LOC_Koffee_AlgaeCultivation_Title = Algae Cultivation Study
        #LOC_Koffee_AlgaeCultivation_Description = A 0.625 m Biology container with a prepared algae culture, nutrient medium and internal lighting. Study cultivation during stays in low and high orbit around any celestial body, with the aim of developing sustainable cultivation systems for future space stations and surface bases. A surface adaptation upgrade enables the same container to conduct the study while landed or splashed down. Preserve the culture for detailed examination after recovery. Scientists with expertise in the field of Biology will complete this experiment in less time.
        #LOC_Koffee_AlgaeCultivation_Tags = experiment research science station container biology algae culture cultivation growth orbit surface upgrade
        #LOC_Koffee_AlgaeCultivation_Result_Default = The culture trial has been completed in the container's illuminated chamber. The scientist documents the appearance and distribution of the algae and preserves the culture for examination after recovery. The report identifies questions to resolve before turning an experimental culture into a dependable crop.
        #LOC_Koffee_AlgaeCultivation_Result_SpaceLow = The algae culture completes its trial in low orbit, under the chamber's controlled internal conditions. The scientist describes how the culture is distributed through the nutrient medium and preserves it for closer examination. The observations will guide future orbital cultivation trials; calling the container a farm is considered premature.
        #LOC_Koffee_AlgaeCultivation_Result_SpaceHigh = Far from the surface below, the illuminated chamber completes its algae cultivation trial. The report documents the culture's appearance and the handling procedures used during the study. The preserved culture will help refine the design of cultivation systems for long stays in space. The crew has politely declined the proposed tasting session.
        #LOC_Koffee_AlgaeCultivation_Result_Landed = The surface-adapted container completes a cultivation trial at the landing site. The algae remain in their prepared medium and sealed chamber, independent of the surrounding soil or atmosphere. The scientist documents the culture for comparison with orbital trials and future base cultivation designs. The label still says experiment, not salad.
        #LOC_Koffee_AlgaeCultivation_Result_Splashed = The surface-adapted chamber completes its trial while the vessel is afloat. The algae remain inside the container with their prepared nutrient medium; no surrounding liquid enters the culture. The scientist documents the trial and preserves the culture for examination. The suggestion to open the lid for watering is firmly rejected.
        #LOC_Koffee_AlgaeCultivation_SurfaceUpgrade_Title = Surface algae cultivation
        #LOC_Koffee_AlgaeCultivation_SurfaceUpgrade_Info = Enables Algae Cultivation Study while landed or splashed down.
        #LOC_Koffee_AlgaeCultivation_SurfaceUpgrade_Description = Adapt the algae experiment container for cultivation studies at surface installations. Its sealed culture chamber and orbital operation are retained.
