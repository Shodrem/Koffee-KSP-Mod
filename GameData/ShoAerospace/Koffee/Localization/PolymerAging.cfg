        #LOC_Koffee_PolymerAging_PartTitle = Polymer Aging in Vacuum
        #LOC_Koffee_PolymerAging_Title = Polymer Aging in Vacuum
        #LOC_Koffee_PolymerAging_Description = This container incorporates an internal vacuum chamber with plastic and seal material specimens. The test studies aging, loss of volatile substances and retention of flexibility. It can run in orbit or on the surface: the sealed chamber provides the vacuum, even on bodies with an atmosphere.\n\nThe test report can be transmitted, but recovering the specimens will allow them to be examined and compared with references kept on Kerbin. The inventory includes seal samples; none have been taken from a hatch that still needs to close.\n\nScientists specializing in Materials & Chemistry will complete this experiment in less time.
        #LOC_Koffee_PolymerAging_Tags = experiment research science station container materials chemistry solutions polymers vacuum orbital surface
        #LOC_Koffee_PolymerAging_Result_Default = The specimen aging protocol has been completed inside the vacuum chamber. The samples are reserved for flexibility tests and volatile substance analysis after recovery.\n\nThe team requested a spare seal for comparison. Maintenance approved the request after checking that the original seal was still in place.
        #LOC_Koffee_PolymerAging_Result_InSpaceLow = The orbital polymer test has finished with the specimens retained inside the vacuum chamber. The report records completion of the protocol; mechanical properties will be determined when the samples are recovered.\n\nThe crew has been reminded that bending a specimen until it breaks before returning it counts as getting ahead of the laboratory.
        #LOC_Koffee_PolymerAging_Result_InSpaceHigh = The specimens have completed their aging test in the vacuum chamber during the stay in high orbit. The set is retained for analysis on Kerbin; no radiation dose has been measured and no changes are attributed to it.\n\nThe materials department insists on receiving specimens that still look intact as well. “Still works” is not a recognised unit of flexibility.
        #LOC_Koffee_PolymerAging_Result_SrfLanded = The surface test has finished with the specimens inside their internal vacuum chamber. The samples have not been exposed to the soil or outside atmosphere and are ready for recovery and comparison on Kerbin.\n\nThe crew proposed checking a seal by fitting it to a hatch. The protocol prefers the first leak test to take place without an audience inside.
    }
    es-es
    {
        #LOC_Koffee_PolymerAging_PartTitle = Envejecimiento de polímeros en vacío
        #LOC_Koffee_PolymerAging_Title = Envejecimiento de polímeros en vacío
        #LOC_Koffee_PolymerAging_Description = Este contenedor incorpora una cámara de vacío interna con probetas de plásticos y materiales de juntas. El ensayo estudia su envejecimiento, pérdida de sustancias volátiles y conservación de flexibilidad. Puede realizarse en órbita o en superficie: el vacío lo proporciona la cámara sellada, incluso en cuerpos con atmósfera.\n\nEl informe del ensayo se puede transmitir, pero recuperar las probetas permitirá examinarlas y compararlas con las referencias conservadas en Kerbin. El inventario incluye muestras de juntas; ninguna procede de una escotilla que todavía deba cerrar.\n\nCientíficos expertos en el campo de Materiales y química realizarán este experimento en menos tiempo.
        #LOC_Koffee_PolymerAging_Tags = experimento investigación ciencia estación contenedor materiales química soluciones polímeros vacío orbital superficie
        #LOC_Koffee_PolymerAging_Result_Default = Se ha completado el protocolo de envejecimiento de las probetas dentro de la cámara de vacío. Las muestras quedan reservadas para los ensayos de flexibilidad y el análisis de sustancias volátiles tras su recuperación.\n\nEl equipo ha solicitado una junta de repuesto para compararla. Mantenimiento ha autorizado la petición después de comprobar que la junta original sigue en su sitio.
        #LOC_Koffee_PolymerAging_Result_InSpaceLow = El ensayo orbital de polímeros ha finalizado con las probetas conservadas dentro de la cámara de vacío. El informe registra la finalización del protocolo; las propiedades mecánicas se determinarán al recuperar las muestras.\n\nSe ha recordado a la tripulación que doblar una probeta hasta que se rompa antes de devolverla cuenta como adelantarse al laboratorio.
        #LOC_Koffee_PolymerAging_Result_InSpaceHigh = Las probetas han completado su ensayo de envejecimiento en la cámara de vacío durante la estancia en órbita alta. Se conserva el conjunto para analizarlo en Kerbin; no se ha medido una dosis de radiación ni se atribuyen cambios a ella.\n\nEl departamento de materiales insiste en recibir también las muestras que parezcan intactas. «Todavía sirve» no es una unidad reconocida de flexibilidad.
        #LOC_Koffee_PolymerAging_Result_SrfLanded = El ensayo de superficie ha terminado con las probetas dentro de su cámara de vacío interna. Las muestras no se han expuesto al suelo ni a la atmósfera exterior y quedan preparadas para su recuperación y comparación en Kerbin.\n\nLa tripulación ha propuesto comprobar una junta instalándola en una escotilla. El protocolo prefiere que la primera prueba de estanqueidad no tenga público dentro.
    }
}
