        #LOC_Koffee_SolutionChemistry_PartTitle = Solution Chemistry
        #LOC_Koffee_SolutionChemistry_Title = Solution Chemistry
        #LOC_Koffee_SolutionChemistry_Description = This container holds small sealed chambers with prepared solutions for studying mixing and precipitate formation. In orbit, their behaviour is compared in microgravity; on the surface, the study examines settling and separation under local gravity. No samples are taken from the soil or the outside atmosphere.\n\nThe test report can be transmitted. Recovering the chambers will allow the liquids and precipitates to be analysed on Kerbin. The protocol requires keeping the lids closed, however convincing the colour of the contents may be.\n\nScientists specializing in Materials & Chemistry will complete this experiment in less time.
        #LOC_Koffee_SolutionChemistry_Tags = experiment research science station container materials chemistry solutions polymers vacuum orbital surface
        #LOC_Koffee_SolutionChemistry_Result_Default = The mixing and separation protocol has been completed in the sealed chambers. The report describes the test; detailed composition analysis awaits the recovered samples.\n\nThe chemistry department reminds the crew that “solution” describes the contents of the chambers and does not promise to solve the station’s problems.
        #LOC_Koffee_SolutionChemistry_Result_InSpaceLow = The orbital test has allowed mixing and precipitate formation to be studied without the usual settling seen in a surface laboratory. The chambers remain sealed so their samples can be compared on Kerbin.\n\nA request for a more powerful stirrer has been rejected: the aim was to study how liquids mix, not how long it takes to shake the container loose.
        #LOC_Koffee_SolutionChemistry_Result_InSpaceHigh = The solution test has been completed in microgravity far from the surface. The samples are ready for recovery; the report does not include a chemical analysis of the liquids.\n\nThe team confirms that moving the laboratory farther from Kerbin does not stop the chemistry department asking for its containers back.
        #LOC_Koffee_SolutionChemistry_Result_SrfLanded = The surface test has allowed the role of local gravity in precipitate settling and separation of the prepared solutions to be studied. The chambers remain sealed and contain no material from the terrain.\n\nThe crew has marked the bottom of each chamber. Chemistry appreciates the gesture and asks that nobody reverse the labels to make the comparison easier.
    }
    es-es
    {
        #LOC_Koffee_SolutionChemistry_PartTitle = Química de soluciones
        #LOC_Koffee_SolutionChemistry_Title = Química de soluciones
        #LOC_Koffee_SolutionChemistry_Description = Este contenedor reúne pequeñas cámaras selladas con soluciones preparadas para estudiar su mezcla y la formación de precipitados. En órbita se compara su comportamiento en microgravedad; en superficie se estudian la sedimentación y la separación bajo la gravedad local. No se toman muestras del suelo ni de la atmósfera exterior.\n\nLa transmisión permite enviar el informe del ensayo. Recuperar las cámaras permitirá analizar los líquidos y los precipitados en Kerbin. El protocolo exige mantener las tapas cerradas, aunque el contenido tenga un color muy convincente.\n\nCientíficos expertos en el campo de Materiales y química realizarán este experimento en menos tiempo.
        #LOC_Koffee_SolutionChemistry_Tags = experimento investigación ciencia estación contenedor materiales química soluciones polímeros vacío orbital superficie
        #LOC_Koffee_SolutionChemistry_Result_Default = Se ha completado el protocolo de mezcla y separación de las soluciones en sus cámaras selladas. El informe describe el ensayo; la composición detallada queda pendiente del análisis de las muestras recuperadas.\n\nEl departamento de química recuerda que «solución» describe el contenido de los recipientes y no garantiza resolver los problemas de la estación.
        #LOC_Koffee_SolutionChemistry_Result_InSpaceLow = El ensayo orbital ha permitido estudiar la mezcla y la formación de precipitados sin la sedimentación habitual de un laboratorio en superficie. Las cámaras se conservan selladas para comparar sus muestras en Kerbin.\n\nSe ha rechazado añadir un agitador más potente: el objetivo era estudiar cómo se mezclan los líquidos, no comprobar cuánto tarda en aflojarse el contenedor.
        #LOC_Koffee_SolutionChemistry_Result_InSpaceHigh = Se ha completado el ensayo de soluciones en microgravedad lejos de la superficie. Las muestras quedan preparadas para su recuperación; el informe no incluye un análisis químico de los líquidos.\n\nEl equipo confirma que alejar más el laboratorio de Kerbin no evita que el departamento de química siga reclamando sus recipientes.
        #LOC_Koffee_SolutionChemistry_Result_SrfLanded = El ensayo de superficie ha permitido estudiar cómo la gravedad local interviene en la sedimentación de los precipitados y la separación de las soluciones preparadas. Las cámaras siguen selladas y no contienen material del terreno.\n\nLa tripulación ha marcado la parte inferior de cada recipiente. Química agradece el gesto y pide que nadie invierta las etiquetas para facilitar la comparación.
    }
}
