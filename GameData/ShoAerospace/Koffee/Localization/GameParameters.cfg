        #Koffee_Settings_RPHelp = Processing speed from 0.1× to 10×. 1× is neutral. Does not change RP budgets or science rewards. In an existing game, save and reload to apply changes.
        #Koffee_Settings_Duration = Experiment duration
        #Koffee_Settings_DurationHelp = Choose 0.1×, 0.5×, 1×, 2× or 4×. At constant RP speed, 10 hours become 1, 5, 10, 20 or 40 hours. Combined rate: RP speed / duration.
        #Koffee_Settings_ReloadNotice = New games use these settings from their first load. Changes made during a game require saving and reloading the game (or restarting KSP). Until then, research and estimates keep their previous rate.
