        #LOC_Koffee_ThermalEnvironmentStudy_PartTitle = Estudio prolongado del entorno térmico
        #LOC_Koffee_ThermalEnvironmentStudy_Title = Estudio prolongado del entorno térmico
        #LOC_Koffee_ThermalEnvironmentStudy_Description = Un dispositivo de investigación ED-01 de Entorno para estudiar el entorno térmico durante una estancia prolongada en superficie o en órbita baja o alta de cualquier cuerpo celeste. Requiere un termómetro 2HOT instalado en la misma nave y produce datos completamente transmisibles. Científicos expertos en el campo de Entorno realizarán este experimento en menos tiempo.
        #LOC_Koffee_ThermalEnvironmentStudy_Tags = experimento investigación ciencia estación dispositivo entorno temperatura térmico termómetro superficie órbita environment thermal ED-01 radial
        #LOC_Koffee_ThermalEnvironmentStudy_Result_Default = Las observaciones sucesivas proporcionan una referencia del entorno térmico durante la estancia. El equipo propone utilizarla para planificar el aislamiento y la protección de futuras misiones. La temperatura del café se ha anotado en un informe aparte.
        #LOC_Koffee_ThermalEnvironmentStudy_Result_Landed = El estudio reúne observaciones térmicas del lugar de aterrizaje durante sucesivas sesiones de trabajo. El registro permitirá comparar este entorno con otros destinos y planificar estancias más largas en superficie. El científico solicita que nadie use el termómetro para remover el café.
        #LOC_Koffee_ThermalEnvironmentStudy_Result_SpaceLow = Las observaciones repetidas en órbita baja proporcionan una referencia térmica de esta etapa de la misión. El equipo estudia cómo utilizarla para mejorar la protección de futuros vehículos. La taza del científico todavía necesita su propio aislamiento.
        #LOC_Koffee_ThermalEnvironmentStudy_Result_SpaceHigh = El registro prolongado en órbita alta permite caracterizar el entorno térmico durante la estancia y compararlo con otras etapas de la misión. El informe recomienda tener en cuenta estos datos al diseñar futuras expediciones. Dejar el café junto al termómetro no lo convierte en un sistema de calefacción.
    }
