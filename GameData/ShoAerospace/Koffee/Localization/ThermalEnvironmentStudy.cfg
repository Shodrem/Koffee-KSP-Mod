        #LOC_Koffee_ThermalEnvironmentStudy_Title = Extended Thermal Environment Study
        #LOC_Koffee_ThermalEnvironmentStudy_Description = An ED-01 Environment research device for studying thermal conditions during an extended stay on the surface or in low or high orbit around any celestial body. Requires a 2HOT thermometer installed on the same vessel and produces fully transmissible data. Scientists with expertise in the field of Environment will complete this experiment in less time.
        #LOC_Koffee_ThermalEnvironmentStudy_Tags = experiment research science station device environment temperature thermal thermometer surface orbit ED-01 radial
        #LOC_Koffee_ThermalEnvironmentStudy_Result_Default = Successive observations provide a reference for the thermal environment throughout the stay. The team proposes using it to plan insulation and protection for future missions. Coffee temperature has been recorded in a separate report.
        #LOC_Koffee_ThermalEnvironmentStudy_Result_Landed = The study brings together thermal observations at the landing site across successive work sessions. The record will help compare this environment with other destinations and plan longer surface stays. The scientist asks everyone to stop using the thermometer to stir their coffee.
        #LOC_Koffee_ThermalEnvironmentStudy_Result_SpaceLow = Repeated observations in low orbit provide a thermal reference for this stage of the mission. The team considers how to use it to improve protection for future vehicles. The scientist's cup still needs insulation of its own.
        #LOC_Koffee_ThermalEnvironmentStudy_Result_SpaceHigh = The extended record in high orbit helps characterize thermal conditions throughout the stay and compare them with other mission stages. The report recommends considering these data when designing future expeditions. Leaving coffee beside the thermometer does not turn it into a heating system.
    }
