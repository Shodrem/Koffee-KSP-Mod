        #LOC_Koffee_RadiationPressure_Title = Solar radiation pressure
        #LOC_Koffee_RadiationPressure_PartTitle = Solar radiation pressure
        #LOC_Koffee_RadiationPressure_Description = The RP-A checks that sunlight reaches its aperture and captures the vessel's published solar irradiance at the start of the trial. The ED-01 team estimates radiation pressure on ideal absorbing and specularly reflecting surfaces at reference normal incidence. Requires only an SHO Radiation Pressure Meter RP-A on the same vessel, unshielded and facing the star with a clear aperture. Conducted in low or high orbit. This version supports a single identified star; it cannot attribute an aggregate from multiple stars. The research analyzes the initial snapshot, without integrating subsequent exposure or measuring a mechanical force. Scientists with expertise in Physics will complete this experiment in less time.
        #LOC_Koffee_RadiationPressure_Tags = Koffee SHO RP-A ED-01 science research physics solar radiation pressure photons light orbit
        #LOC_Koffee_RadiationPressure_Result_Default = The attached report estimates ideal radiation pressures from the irradiance snapshot captured at the start of the trial.
        #LOC_Koffee_RadiationPressure_Result = The team has analyzed the initial light snapshot taken in orbit around <<1>>. Even light transfers momentum: the ideal reflector receives twice the pressure of the ideal absorber at normal incidence. These values are optical estimates, not a mechanical force measured by the instrument.
        #Koffee_RPA_Reading = Initial snapshot: <<1>> W/m². Estimated pressure at reference normal incidence: ideal absorber <<2>> µPa; ideal specular reflector <<3>> µPa. Model: p=F/c and p=2F/c, c=299792458 m/s. Capture UT: <<4>>. Scientific context: <<5>>. Five aperture trajectories were clear according to colliders at capture; this is not a continuous optical shadow map or an exposure history. Subsequent research does not resample light.
        #Koffee_RPA_Error_Equipment = Install an SHO Radiation Pressure Meter RP-A on this vessel
        #Koffee_RPA_Error_NotReady = Cannot verify a coherent initial solar capture; wait for normal loaded physics
        #Koffee_RPA_Error_NoLight = No sunlight, or the stellar disk is occulted
        #Koffee_RPA_Error_Source = Cannot attribute the solar flux to a single identified star; multiple-source aggregates are unsupported
        #Koffee_RPA_Error_Shielded = The RP-A is shielded by a fairing or bay
        #Koffee_RPA_Error_Optics = The RP-A aperture reference is unavailable
        #Koffee_RPA_Error_Facing = Point the RP-A aperture toward the star
        #Koffee_RPA_Error_Occluded = A collider blocks a sampled RP-A optical path
    }
    es-es
    {
        #LOC_Koffee_RadiationPressure_Title = Presión de radiación solar
        #LOC_Koffee_RadiationPressure_PartTitle = Presión de radiación solar
        #LOC_Koffee_RadiationPressure_Description = El RP-A comprueba que la luz solar alcanza su abertura y captura la irradiancia solar publicada para la nave al iniciar el ensayo. El equipo del ED-01 estima la presión de radiación sobre superficies ideales absorbentes y reflectantes especulares con incidencia normal de referencia. Requiere únicamente un SHO Medidor de presión de radiación RP-A en la misma nave, sin protección y orientado hacia la estrella con la abertura despejada. Se realiza en órbita baja o alta. Esta versión admite una sola estrella identificada; no puede atribuir un agregado de varias estrellas. La investigación analiza la captura inicial, sin integrar la exposición posterior ni medir una fuerza mecánica. Científicos expertos en el campo de Física realizarán este experimento en menos tiempo.
        #LOC_Koffee_RadiationPressure_Tags = Koffee SHO RP-A ED-01 ciencia investigación física solar radiación presión fotones luz órbita
        #LOC_Koffee_RadiationPressure_Result_Default = El informe adjunto estima las presiones de radiación ideales a partir de la captura de irradiancia registrada al iniciar el ensayo.
        #LOC_Koffee_RadiationPressure_Result = El equipo ha analizado la captura inicial de luz tomada en órbita de <<1>>. La luz también transfiere momento: el reflector ideal recibe el doble de presión que el absorbente ideal con incidencia normal. Estos valores son estimaciones ópticas, no una fuerza mecánica medida por el instrumento.
        #Koffee_RPA_Reading = Captura inicial: <<1>> W/m². Presión estimada con incidencia normal de referencia: absorbente ideal <<2>> µPa; reflector especular ideal <<3>> µPa. Modelo: p=F/c y p=2F/c, c=299792458 m/s. UT de captura: <<4>>. Contexto científico: <<5>>. Cinco trayectorias de la abertura estaban despejadas según los colliders al capturar; no es un mapa óptico continuo de sombras ni un historial de exposición. La investigación posterior no vuelve a muestrear la luz.
        #Koffee_RPA_Error_Equipment = Instala un SHO Medidor de presión de radiación RP-A en esta nave
        #Koffee_RPA_Error_NotReady = No se puede verificar una captura solar inicial coherente; espera a la física normal con la nave cargada
        #Koffee_RPA_Error_NoLight = Sin luz solar o con el disco estelar oculto
        #Koffee_RPA_Error_Source = No se puede atribuir el flujo solar a una sola estrella identificada; los agregados de varias fuentes no son compatibles
        #Koffee_RPA_Error_Shielded = El RP-A está protegido por un carenado o una bahía
        #Koffee_RPA_Error_Optics = No está disponible la referencia de la abertura del RP-A
        #Koffee_RPA_Error_Facing = Orienta la abertura del RP-A hacia la estrella
        #Koffee_RPA_Error_Occluded = Un collider bloquea una trayectoria óptica muestreada del RP-A
