        #LOC_Koffee_SmallMechanismReliability_Description = This container houses a small electromechanical actuator that extends and retracts a rod using a set of special-alloy gears, compensated by extrapolation of sinusoidal fasteners. The mechanism uses a generic-radical cutting lubricant with a thick ionized base, whose technical data sheet expressly advises against replacing it with cafeteria products.\n\nThe test will subject the actuator to repeated operating cycles to study the assembly's reliability during a stay in space. Recovering the container will allow its components to be examined and checked to see whether they are still where we left them.\n\nScientists specializing in Technology will complete this experiment in less time.
        #LOC_Koffee_SmallMechanismReliability_Tags = experiment research science station container technology mechanism actuator reliability rod gears lubricant orbital test
        #LOC_Koffee_SmallMechanismReliability_Result_Default = At first, the actuator appeared to be working correctly. A rhythmic mechanical sound came from inside the container, consistent with the rod extending and retracting and, according to the manufacturer, with a “reasonably nominal” operation.\n\nTowards the end of the test, the rhythm gave way to a series of squeaks and metallic noises that were not mentioned in the procedure. The mechanism eventually fell silent.\n\nGently shaking the container produces several metallic knocks against its walls. The team has recorded the observation as a “possible internal redistribution of components”.\n\nSince the instructions prohibit opening the container during the mission, it will be returned as it is for inspection. Keeping the lid facing upwards is recommended, although it is no longer clear what advantage this offers.
