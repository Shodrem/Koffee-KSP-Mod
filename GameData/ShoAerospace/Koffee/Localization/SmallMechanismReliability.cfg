        #LOC_Koffee_SmallMechanismReliability_Description = Este contenedor incorpora un pequeño actuador electromecánico que extiende y recoge un vástago mediante un conjunto de engranajes de aleación especial, compensados por extrapolación de tornillería sinusoidal. El mecanismo utiliza un lubricante de corte genérico-radical con base espesa ionizada, cuya ficha técnica recomienda expresamente no sustituirlo por productos de cafetería.\n\nEl ensayo someterá el actuador a ciclos repetidos de funcionamiento para estudiar la fiabilidad del conjunto durante una estancia espacial. La recuperación del contenedor permitirá examinar sus componentes y comprobar si siguen estando donde los dejamos.\n\nCientíficos expertos en el campo de Tecnología realizarán este experimento en menos tiempo.
        #LOC_Koffee_SmallMechanismReliability_Tags = experimento investigación ciencia estación contenedor tecnología mecanismo actuador fiabilidad vástago engranajes lubricante ensayo orbital
        #LOC_Koffee_SmallMechanismReliability_Result_Default = Al principio, el actuador parecía funcionar correctamente. Desde el interior del contenedor llegaba un sonido mecánico rítmico, compatible con la extensión y recogida del vástago y, según el fabricante, con un funcionamiento «razonablemente nominal».\n\nHacia el final del ensayo, el ritmo dio paso a una sucesión de chirridos y ruidos metálicos que no figuraban en el procedimiento. El mecanismo terminó por quedarse en silencio.\n\nAl agitar suavemente el contenedor se escuchan varios golpes metálicos contra sus paredes. El equipo ha registrado la observación como «posible redistribución interna de componentes».\n\nDado que las instrucciones prohíben abrir el contenedor durante la misión, se devolverá tal cual para su inspección. Se recomienda mantener la tapa hacia arriba, aunque ya no está claro qué ventaja ofrece.
