        #LOC_Koffee_ExtendedCrewStudy_Title = Estudio prolongado de la tripulación
        #LOC_Koffee_ExtendedCrewStudy_Description = Un dispositivo de investigación ED-01 de Biología para registrar cómo evolucionan la concentración, el descanso, la coordinación y la adaptación de la tripulación durante una estancia prolongada. Incluye formularios, tareas repetibles y un lápiz sujeto con velcro. Científicos expertos en el campo de Biología realizarán este experimento en menos tiempo.
        #LOC_Koffee_ExtendedCrewStudy_Tags = experimento investigación ciencia estación dispositivo biología tripulación informe estudio prolongado biology crew report ED-01 radial
        #LOC_Koffee_ExtendedCrewStudy_Result_Default = Tras varias jornadas, la tripulación necesita menos recordatorios para coordinar las tareas y encuentra sus objetos sin perseguirlos por toda la cabina. Los registros de descanso y concentración sugieren que una rutina compartida ayuda a adaptarse; el lápiz sigue reclamando libertad.
        #LOC_Koffee_ExtendedCrewStudy_Result_KerbinInSpaceLow = Los amaneceres frecuentes distraen al principio y hacen que cada kerbal proponga una hora distinta para dormir. Con los turnos acordados, las tareas repetidas requieren menos correcciones y la coordinación mejora. Se establece que mirar por la ventana cuenta como pausa, aunque el paisaje merezca un informe propio.
        #LOC_Koffee_ExtendedCrewStudy_Result_KerbinInSpaceHigh = Kerbin cabe entero en la ventana, pero ya no marca el ritmo de cada tarea. A lo largo del estudio, los horarios de descanso se vuelven más regulares y la concentración resulta más estable durante las sesiones de trabajo. La tripulación aprende a avisar antes de soltar una carpeta: también es una forma de coordinación orbital.
        #LOC_Koffee_ExtendedCrewStudy_Result_MunInSpaceLow = Las primeras pasadas sobre los cráteres provocan interrupciones y comentarios simultáneos. Tras varios turnos, la tripulación reserva tiempo para observar y completa las tareas con menos omisiones. Los registros muestran una mejor adaptación a la rutina, sin resolver quién puso nombre a un cráter con forma de bocadillo.
        #LOC_Koffee_ExtendedCrewStudy_Result_MunInSpaceHigh = La Mun cambia lentamente de posición y deja de servir como reloj improvisado. La tripulación organiza el descanso por turnos y utiliza listas compartidas para mantener la coordinación. Las sesiones finales muestran menos errores de concentración; contar cráteres para conciliar el sueño sigue siendo una idea poco práctica.
        #LOC_Koffee_ExtendedCrewStudy_Result_MinmusInSpaceLow = El relieve de Minmus despierta al principio tantas ganas de explorar como debates sobre postres. Con el paso de las jornadas, las pausas acordadas reducen las interrupciones y la tripulación coordina mejor las tareas de observación. El informe registra adaptación a la estancia, pero ninguna prueba de que la superficie sea comestible.
        #LOC_Koffee_ExtendedCrewStudy_Result_MinmusInSpaceHigh = Minmus parece una pequeña referencia verde en una ventana llena de oscuridad. Durante la estancia, las llamadas entre turnos y los horarios de descanso ayudan a mantener la concentración y una rutina común. La coordinación mejora cuando cada herramienta tiene un lugar fijo; el lugar reservado para el helado continúa vacío.

        #LOC_Koffee_ContainerIntegrity_PartTitle = Ensayo de integridad del contenedor
        #LOC_Koffee_ContainerIntegrity_Title = Ensayo de integridad del contenedor
        #LOC_Koffee_ContainerIntegrity_Description = Un contenedor instrumentado de 0,625 m diseñado para comprobar que su estructura, sellado y sistema de protección conservan una carga de prueba interna durante toda la misión. Nuestros científicos agradecerían recuperar el contenedor, no solo los datos, para poder estudiarlo. Recuperarlo en Kerbin con su resultado concede un 20% adicional sobre la ciencia recuperada. Científicos expertos en el campo de Tecnología realizarán este experimento en menos tiempo.
