        #LOC_Koffee_ContainerIntegrity_Result_Landed = El contenedor se mantiene en perfectas condiciones. El viento ha depositado algo de polvo sobre la superficie, pero no se observa ningún efecto sobre la estructura ni sobre la carga de prueba.
        #LOC_Koffee_ContainerIntegrity_Result_Splashed = El contenedor se mantiene en perfectas condiciones. Las olas han mojado por completo su superficie y han dejado restos de sal, aunque haría falta una exposición mucho más prolongada para que la corrosión llegase a ser preocupante.
        #LOC_Koffee_ContainerIntegrity_Result_SpaceLow = El contenedor se mantiene en perfectas condiciones. Como esperábamos, la exposición al vacío no parece afectar a la estructura ni a la protección de la carga de prueba.
        #LOC_Koffee_ContainerIntegrity_Result_SpaceHigh = El contenedor se mantiene en perfectas condiciones. La exposición prolongada al entorno de mayor radiación podría provocar una ligera degradación de la pintura exterior, pero la estructura y la protección de la carga de prueba no parecen verse afectadas.
