        #LOC_Koffee_CapillaryTransport_Title = Transporte por capilaridad
        #LOC_Koffee_CapillaryTransport_Description = Se han realizado diversas pruebas de transporte de líquidos por capilaridad con los circuitos y las muestras que venían preparados en el contenedor. Los ensayos permiten estudiar cómo avanzan los líquidos por conductos estrechos sin utilizar una bomba. Al principio, uno de los Kerbals creyó que aquello de la investigación capilar significaba que iban a desarrollar un crecepelo. Todavía está esperando a probar él mismo el tónico.\n\nCientíficos expertos en el campo de Física realizarán este experimento en menos tiempo.
        #LOC_Koffee_CapillaryTransport_Tags = experimento investigación ciencia estación contenedor física capilaridad líquidos conductos órbita
        #LOC_Koffee_CapillaryTransport_Result_Default = Se han completado las pruebas de transporte capilar preparadas en el contenedor. El informe reúne los resultados de los distintos circuitos y muestras ensayados sin utilizar una bomba.
        #LOC_Koffee_CapillaryTransport_Result_InSpaceLow = En órbita baja se han completado las pruebas de transporte capilar preparadas en el contenedor. La nave y las muestras se encuentran en caída libre: el líquido no se acumula en el fondo como lo haría en superficie. La tensión superficial y la interacción con las paredes permiten conducirlo por los distintos circuitos sin utilizar una bomba.\n\nEl informe reúne los resultados de los ensayos y proporciona una referencia para futuras pruebas en órbitas más altas.
        #LOC_Koffee_CapillaryTransport_Result_InSpaceHigh = En órbita alta se han completado las pruebas de transporte capilar preparadas en el contenedor. A mayor distancia del cuerpo, su atracción gravitatoria es menor, pero la nave y las muestras continúan en caída libre. La geometría de los conductos y la interacción del líquido con sus paredes siguen siendo fundamentales para conducirlo sin utilizar una bomba.\n\nEl informe amplía el estudio a órbitas más altas y proporciona resultados que podrán compararse con los de ensayos realizados más cerca del cuerpo.
