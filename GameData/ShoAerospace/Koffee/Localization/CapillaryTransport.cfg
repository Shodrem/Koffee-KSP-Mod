        #LOC_Koffee_CapillaryTransport_Title = Capillary Transport
        #LOC_Koffee_CapillaryTransport_Description = A series of capillary flow tests has been carried out using the circuits and samples supplied inside the container. The tests explore how liquids travel through narrow channels without a pump. After hearing about the hair-thin tubes, one Kerbal initially thought the team would be developing a hair-growth tonic. That Kerbal is still waiting to try the tonic himself.\n\nScientists with expertise in Physics will complete this experiment in less time.
        #LOC_Koffee_CapillaryTransport_Tags = experiment research science station container physics capillary liquid channel orbital test
        #LOC_Koffee_CapillaryTransport_Result_Default = The capillary flow tests prepared inside the container have been completed. The report brings together the results from the different circuits and samples tested without a pump.
        #LOC_Koffee_CapillaryTransport_Result_InSpaceLow = The capillary flow tests prepared inside the container have been completed in low orbit. The spacecraft and samples are in free fall, so the liquid does not settle at the bottom as it would on the surface. Surface tension and interaction with the channel walls allow it to travel through the different circuits without a pump.\n\nThe report brings together the test results and provides a reference for future trials in higher orbits.
        #LOC_Koffee_CapillaryTransport_Result_InSpaceHigh = The capillary flow tests prepared inside the container have been completed in high orbit. Farther from the body, its gravitational pull is weaker, but the spacecraft and samples remain in free fall. Channel geometry and the interaction between the liquid and the walls remain essential to guiding the flow without a pump.\n\nThe report extends the study to higher orbits and provides results that can be compared with trials conducted closer to the body.
