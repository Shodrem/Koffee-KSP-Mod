        #LOC_Koffee_LaserMeasurerLS01_Title = SHO Laser Measurer LS-01
        #LOC_Koffee_LaserMeasurerLS01_Description = The LS-01 laser altimeter is specially designed for precise measurements from low orbit. At higher altitudes it may lose precision, but could still achieve its objective. Rumours that it is "little more than a red torch with a large magnifying glass" are completely false. The magnifying glass is a precision one. The receiver includes a low-quality internal camera to check where the signals are coming from; it could be damaged by the intensity of a reflected laser beam.
        #LOC_Koffee_LaserMeasurerLS01_Tags = SHO Koffee laser altimeter range distance height orbit receiver science instrument
    }
    es-es
    {
        #LOC_Koffee_LaserMeasurerLS01_Title = SHO Laser Measurer LS-01
        #LOC_Koffee_LaserMeasurerLS01_Description = El altímetro láser LS-01 está especialmente diseñado para mediciones exactas desde órbita baja. Desde más altitud podría perder precisión, pero podría conseguir su objetivo. Los rumores de ser "poco más que una linterna roja con una gran lupa" son completamente falsos. La lupa es de precisión. El receptor incluye una cámara de baja calidad en el interior para comprobar desde dónde se reciben las señales; podría dañarse bajo la intensidad de un haz láser rebotado.
        #LOC_Koffee_LaserMeasurerLS01_Tags = SHO Koffee láser altímetro distancia altura órbita receptor ciencia instrumento
