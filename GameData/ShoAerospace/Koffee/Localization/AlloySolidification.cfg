        #LOC_Koffee_AlloySolidification_Description = Este contenedor incorpora un pequeño horno y un molde sellado para estudiar la solidificación de una aleación durante una estancia en órbita. La muestra se fundirá y se dejará enfriar siguiendo un procedimiento cuidadosamente controlado, cuya última revisión insiste en distinguir entre «metal todavía caliente» y «metal que ya se puede tocar».\n\nLa recuperación de la muestra permitirá cortarla, pulirla y examinar su estructura interna. El informe transmitido confirmará cómo ha ido el ensayo, pero el departamento de materiales prefiere recibir el lingote antes de autorizar su uso en algo que tenga que permanecer unido.\n\nCientíficos expertos en el campo de Materiales y química realizarán este experimento en menos tiempo.
