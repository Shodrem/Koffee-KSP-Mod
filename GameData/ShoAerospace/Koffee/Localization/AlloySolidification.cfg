        #LOC_Koffee_AlloySolidification_Description = This container houses a small furnace and a sealed mould to study the solidification of an alloy during a stay in orbit. The sample will be melted and left to cool following a carefully controlled procedure, whose latest revision insists on distinguishing between “metal that is still hot” and “metal that can now be touched”.\n\nRecovering the sample will allow it to be cut, polished and its internal structure examined. The transmitted report will confirm how the test went, but the materials department would prefer to receive the ingot before approving its use in anything that needs to stay in one piece.\n\nScientists specializing in Materials & Chemistry will complete this experiment in less time.
        #LOC_Koffee_AlloySolidification_Tags = experiment research science station container materials chemistry alloy solidification furnace mould ingot orbital test
